["Preventive","A preventive control physically or technically stops the action (e.g., a lock). A sign cannot stop anyone."],
["Detective","Detective controls identify an event during or after it occurs (e.g., cameras with monitoring, logs). A sign does not detect anything."],
["Compensating","A compensating control is an alternative used when a primary control is not feasible. Nothing here is being substituted."]],0,
"Warning signs discourage an attacker from attempting an action, which is the definition of a deterrent control.");
M("1.1","An auditor finds that a legacy manufacturing system cannot support MFA. The security team places the system on an isolated VLAN and requires access through a jump server with MFA. Which control type is the isolated VLAN with jump server?",[
["Compensating"],
["Corrective","Corrective controls fix or restore after an incident occurs, such as restoring from backup."],
["Directive","Directive controls instruct behavior, such as a policy stating what users must do."],
["Deterrent","Deterrent controls discourage attempts; they do not provide alternative protection for an unmet requirement."]],0,
"When the required control (MFA on the system itself) cannot be implemented, an alternative measure that provides similar protection is a compensating control.");
M("1.1","Which of the following is an example of a managerial security control?",[
["A risk assessment performed annually by the security team"],
["Security guards checking badges at the lobby","Guards are a physical/operational control carried out by people, not a managerial (administrative/strategic) control."],
["A host-based firewall on all laptops","A firewall is a technical control implemented through technology."],
["Daily review of firewall logs by an analyst","Day-to-day activities performed by people are operational controls."]],0,
"Managerial controls focus on the governance and management of risk: risk assessments, policies, security planning. They are administrative and strategic in nature.");
M("1.1","After a ransomware infection, an administrator restores the affected file server from last night's backup. Which type of control is the backup restoration?",[
["Corrective"],
["Detective","Detective controls identify an incident; restoring data does not identify anything."],
["Preventive","Preventive controls stop an incident before it happens; the restoration occurred after the incident."],
["Deterrent","Deterrent controls discourage attackers; a backup restore does not discourage anyone."]],0,
"Corrective controls reduce the impact of an incident and restore systems to normal after it occurs. Restoring from backup is the classic example.");
M("1.1","A security manager publishes an acceptable use policy that states employees must lock their workstations when they step away. Which control type BEST describes this policy statement?",[
["Directive"],
["Technical","A technical control would be an automatic screen lock enforced by Group Policy, not a written statement."],
["Detective","Nothing in a policy detects events."],
["Corrective","The policy does not fix or restore anything after an incident."]],0,
"A directive control directs or instructs people to behave in a certain way, typically through policies, procedures, and standards. Directive controls rely on people to comply.");
M("1.1","Which of the following are examples of operational controls? (Choose two.)",[
["Security awareness training delivered by HR"],
["Guards performing a nightly patrol of the facility"],
["An encryption standard requiring AES-256","An encryption standard is a managerial (policy/standard) document; the encryption itself would be technical."],
["An intrusion prevention system blocking traffic","An IPS is a technical control implemented by technology."],
["A quarterly risk register review by leadership","Risk oversight by leadership is a managerial control."]],[0,1],
"Operational controls are implemented and executed by people rather than systems: awareness training, guard patrols, configuration management performed by staff, etc.");
M("1.2","A company wants to ensure that a sender cannot later deny having sent a signed purchase order. Which security concept does this describe?",[
["Non-repudiation"],
["Confidentiality","Confidentiality keeps data secret from unauthorized parties; it does not prove origin."],
["Availability","Availability ensures systems and data are accessible when needed."],
["Authorization","Authorization determines what an authenticated user is allowed to do; it does not prove who sent a message."]],0,
"Non-repudiation provides proof of origin and integrity so the sender cannot deny the action. Digital signatures are the typical mechanism.");
M("1.2","In a zero trust architecture, which component makes the decision to grant, deny, or revoke access to a resource based on policy and inputs such as threat intelligence and identity?",[
["Policy engine"],
["Policy enforcement point","The PEP sits in the data plane and enforces (allows/blocks) the connection; it does not make the decision."],
["Implicit trust zone","Implicit trust zones are areas where trust is assumed after the PEP; zero trust seeks to minimize them."],
["Subject/system","The subject is the user or device requesting access, not the decision maker."]],0,
"In the NIST zero trust model, the policy engine (control plane) makes the access decision; the policy administrator communicates it and establishes/tears down the session; the policy enforcement point enforces it in the data plane.");
M("1.2","Which zero trust component is responsible for generating session-specific credentials and instructing the policy enforcement point to allow or terminate a connection after a decision is made?",[
["Policy administrator"],
["Policy engine","The policy engine makes the decision, but the policy administrator carries it out by configuring the PEP."],
["Adaptive identity","Adaptive identity is a concept that uses context (location, device, behavior) to evaluate identity; it is not a component that configures the PEP."],
["Threat scope reduction","Threat scope reduction is a goal (shrinking the attack surface), not a component."]],0,
"The policy administrator establishes and shuts down the communication path between subject and resource, including generating session tokens, based on the policy engine's decision.");
M("1.2","A security team places a fake file named 'Passwords_2026.xlsx' on a file share. Any access to the file triggers an alert. What is this file called?",[
["Honeyfile"],
["Honeypot","A honeypot is a decoy system or service, not a single file."],
["Honeynet","A honeynet is a network of honeypots."],
["Honeytoken","A honeytoken is typically fake data such as a credential, API key, or database record; a decoy document on a share is specifically a honeyfile."]],0,
"A honeyfile is a decoy file intended to attract an attacker; any interaction with it is suspicious and generates an alert.");
M("1.2","An organization wants to prevent vehicles from being driven into the lobby glass of its headquarters while still allowing pedestrians to pass. Which control is MOST appropriate?",[
["Bollards"],
["Access control vestibule","A vestibule (mantrap) controls pedestrian entry one person at a time; it does not stop vehicles."],
["Security lighting","Lighting deters and aids surveillance but does not physically stop a vehicle."],
["Pressure sensors","Pressure sensors detect presence; they do not stop a vehicle."]],0,
"Bollards are short, sturdy posts that block vehicle access while allowing people to walk between them.");
M("1.2","A data center wants to stop tailgating at its main entrance. Which control BEST addresses this?",[
["Access control vestibule"],
["Fencing","Fencing protects a perimeter but does not stop someone from following an authorized person through a door."],
["Bollards","Bollards stop vehicles, not people following others."],
["Infrared motion sensors","Sensors can detect movement but do not prevent a second person from entering."]],0,
"An access control vestibule (mantrap) has two doors where only one can open at a time, allowing a guard or system to ensure only one authenticated person enters.");
M("1.2","A company performs an assessment that compares its current security posture against the NIST CSF to identify which controls are missing. What is this called?",[
["Gap analysis"],
["Penetration test","A penetration test actively exploits vulnerabilities; it does not compare against a framework baseline."],
["Business impact analysis","A BIA identifies critical processes and the impact of their disruption."],
["Vulnerability scan","A vulnerability scan identifies technical weaknesses on systems, not missing framework controls."]],0,
"A gap analysis compares the current state to a desired state (often a framework or standard) to identify the gaps that must be addressed.");
M("1.2","Which of the following BEST describes the purpose of the 'accounting' component of AAA?",[
["Recording user activity such as login times and resources accessed"],
["Verifying a user's identity with credentials","That describes authentication."],
["Determining which resources a user can access","That describes authorization."],
["Billing departments for IT services","In AAA, accounting refers to tracking activity, not financial billing."]],0,
"Accounting tracks what users do (sessions, commands, data transferred), providing an audit trail.");
M("1.2","An organization's VPN concentrator checks each connecting laptop for an up-to-date EDR agent and OS patch level before granting access to internal resources. This is an example of authenticating which entity?",[
["Systems (devices)"],
["People","The checks are against the device's posture, not the user's identity."],
["Federation partners","Federation involves trust between organizations' identity providers."],
["Certificate authorities","CAs issue certificates; they are not being authenticated here."]],0,
"AAA applies to both people and systems. Device posture checks and device certificates authenticate/authorize the system itself.");
M("1.3","Before a firewall firmware upgrade, the change advisory board asks the engineer to document how the device will be returned to its previous state if the upgrade fails. What is being requested?",[
["Backout plan"],
["Impact analysis","Impact analysis evaluates the effect and risk of the change; it does not describe how to revert."],
["Maintenance window","A maintenance window is the scheduled time for the change."],
["Standard operating procedure","An SOP is a routine documented procedure, not a change-specific reversal plan."]],0,
"A backout plan documents how to revert a change and restore the previous state if the change fails or causes problems.");
M("1.3","A change to a web server's TLS configuration requires the web service to be restarted. Which change management consideration is MOST directly relevant?",[
["Scheduling during a maintenance window to account for downtime"],
["Updating the allow list","Allow lists relate to which applications/addresses are permitted; restarts do not require them."],
["Legal hold","Legal hold preserves evidence for litigation; unrelated to a service restart."],
["Data sovereignty","Data sovereignty relates to the laws where data is stored."]],0,
"Service restarts cause downtime; change management schedules such changes during an approved maintenance window to minimize business impact.");
M("1.3","An administrator updates a configuration file for a critical application. Which practice BEST ensures the team can see what was changed and revert to a prior known-good version?",[
["Version control"],
["Change advisory board approval","CAB approval authorizes changes but does not track file versions."],
["Stakeholder notification","Notification informs people but does not track content changes."],
["Penetration testing","Pen testing finds vulnerabilities; it does not track configuration history."]],0,
"Version control tracks changes to code and configuration over time, showing who changed what and allowing rollback.");
M("1.3","During impact analysis for a planned database upgrade, the team discovers that three internal applications rely on a deprecated database function. What change management factor did they identify?",[
["Dependencies"],
["Ownership","Ownership identifies who is responsible for the change or asset."],
["Restricted activities","Restricted activities are actions explicitly limited during a change."],
["Test results","Test results are the outcome of testing, not the relationships between systems."]],0,
"Dependencies are other systems or processes that rely on the component being changed; they must be identified so the change does not break them.");
M("1.3","Which change management role is MOST responsible for approving or rejecting a proposed change after reviewing risk and impact?",[
["Change advisory board (CAB)"],
["Change requester","The requester submits and justifies the change but does not approve it."],
["End users","Users may be stakeholders who are informed, but they do not formally approve."],
["Help desk","The help desk may report impacts but does not approve changes."]],0,
"The CAB reviews change requests, considers impact and risk, and approves, rejects, or defers them.");
M("1.4","A company needs to encrypt large volumes of data on backup tapes quickly. Which type of encryption is MOST appropriate for the bulk encryption?",[
["Symmetric encryption such as AES"],
["Asymmetric encryption such as RSA","Asymmetric encryption is computationally expensive and not used for bulk data; it is used for key exchange and signatures."],
["Hashing with SHA-256","Hashing is one-way and cannot be decrypted, so the backups could not be restored."],
["Steganography","Steganography hides data inside other data; it is not a bulk encryption method."]],0,
"Symmetric algorithms like AES are fast and efficient for encrypting large amounts of data.");
M("1.4","Alice wants to send Bob a message that only Bob can read. Which key should Alice use to encrypt the message?",[
["Bob's public key"],
["Bob's private key","Only Bob has his private key; Alice cannot (and should not) have it."],
["Alice's private key","Encrypting with Alice's private key creates a signature that anyone with Alice's public key can verify; it does not provide confidentiality."],
["Alice's public key","Only Alice's private key could decrypt that, so Bob could not read it."]],0,
"For confidentiality with asymmetric cryptography, encrypt with the recipient's public key; only the recipient's private key can decrypt.");
M("1.4","Which of the following provides integrity, authentication of origin, and non-repudiation for an email message?",[
["Digital signature"],
["Symmetric encryption","Symmetric encryption provides confidentiality; since both parties share the key, it cannot provide non-repudiation."],
["Hashing alone","A hash provides integrity but not authentication of origin, since anyone can compute a hash."],
["Tokenization","Tokenization replaces sensitive data with a token; it does not prove origin."]],0,
"A digital signature is created by hashing the message and encrypting the hash with the sender's private key, providing integrity, authentication, and non-repudiation.");
M("1.4","A web application stores user passwords. Which approach BEST protects the passwords if the database is stolen?",[
["Hash with a unique salt per password using a key-stretching algorithm such as bcrypt or PBKDF2"],
["Encrypt the passwords with AES using a key stored in the same database","If the key is stored with the data, an attacker who steals the database can decrypt all passwords."],
["Hash the passwords with MD5","MD5 is fast and broken; unsalted fast hashes are easily cracked with rainbow tables or GPUs."],
["Store passwords in Base64","Base64 is encoding, not encryption; it is trivially reversed."]],0,
"Salting defeats rainbow tables and makes identical passwords hash differently; key stretching slows each guess, making brute force far more expensive.");
M("1.4","A browser checks whether a website's certificate has been revoked by sending a real-time query and receiving a signed 'good', 'revoked', or 'unknown' response. Which mechanism is being used?",[
["OCSP"],
["CRL","A CRL is a downloaded list of revoked serial numbers published periodically, not a real-time query per certificate."],
["CSR","A certificate signing request is sent to a CA to request a certificate."],
["Key escrow","Key escrow stores copies of keys with a third party."]],0,
"The Online Certificate Status Protocol provides real-time revocation status for an individual certificate. OCSP stapling lets the server attach the response to the handshake.");
M("1.4","An administrator needs a single certificate to secure www.example.com, mail.example.com, and shop.example.com. Which certificate type is MOST appropriate?",[
["Wildcard certificate for *.example.com"],
["Self-signed certificate","A self-signed certificate is not trusted by public browsers."],
["Code-signing certificate","Code-signing certificates sign software, not websites."],
["Root certificate","Root certificates belong to CAs and sign other certificates; they are not issued for websites."]],0,
"A wildcard certificate covers all first-level subdomains of a domain. (A SAN certificate listing each name would also work, but it is not an option here.)");
M("1.4","Which hardware component built into a laptop's motherboard securely stores keys used for full-disk encryption and supports secure boot measurements?",[
["Trusted Platform Module (TPM)"],
["Hardware security module (HSM)","An HSM is typically a dedicated network appliance or card for enterprise key management, not built into laptops."],
["Key management system (KMS)","A KMS is a service for managing keys, often cloud-based; it is not a motherboard chip."],
["Secure enclave","A secure enclave is a protected processor area for sensitive operations (e.g., in phones); the TPM is the standard chip for FDE key storage and boot measurement on PCs."]],0,
"The TPM is a chip that stores keys, performs cryptographic operations, and records boot measurements for attestation; BitLocker commonly uses it.");
M("1.4","A payment processor replaces credit card numbers in its database with random values that map back to the original numbers only through a separate, secured vault. What technique is this?",[
["Tokenization"],
["Data masking","Masking hides part of the data (e.g., showing only the last four digits) but does not substitute a mappable random value stored in a vault."],
["Hashing","Hashing is one-way; there is no vault lookup to retrieve the original."],
["Steganography","Steganography hides data within other media."]],0,
"Tokenization replaces sensitive data with a non-sensitive token; the mapping is stored in a secured token vault, reducing PCI DSS scope.");
M("1.4","A company's employees use a shared cloud storage service. The security team wants a copy of encryption keys held by a trusted third party so that data can be recovered if keys are lost. What is this called?",[
["Key escrow"],
["Key stretching","Key stretching strengthens weak keys/passwords by repeated hashing."],
["Certificate pinning","Pinning associates a host with an expected certificate or public key."],
["Perfect forward secrecy","PFS ensures that compromise of a long-term key does not expose past session keys."]],0,
"Key escrow is the storage of keys with a trusted third party so they can be recovered under defined conditions.");
M("1.4","Which of the following describes the purpose of a certificate signing request (CSR)?",[
["It contains the requester's public key and identifying information and is sent to a CA to obtain a signed certificate"],
["It lists certificates that have been revoked before their expiration","That describes a CRL."],
["It transmits the private key to the CA for backup","The private key never leaves the requester when generating a CSR."],
["It checks a certificate's revocation status in real time","That describes OCSP."]],0,
"The requester generates a key pair, then creates a CSR containing the public key and subject information. The CA validates the request and returns a signed certificate.");
M("1.4","Two hosts need to agree on a shared symmetric session key over an untrusted network without ever transmitting the key itself. Which algorithm is designed for this?",[
["Diffie-Hellman"],
["AES","AES is a symmetric cipher that needs a shared key; it does not establish one."],
["SHA-256","SHA-256 is a hashing algorithm."],
["RC4","RC4 is a deprecated symmetric stream cipher."]],0,
"Diffie-Hellman (and ECDHE) lets two parties derive a shared secret over an insecure channel without sending the secret. Ephemeral variants provide forward secrecy.");
M("1.4","A security analyst needs to hide a small configuration file inside an image file so that it is not apparent the image contains data. Which technique is this?",[
["Steganography"],
["Tokenization","Tokenization substitutes data with tokens; it does not hide data inside media."],
["Data masking","Masking obscures part of data for display."],
["Salting","Salting adds random data before hashing."]],0,
"Steganography conceals data within other files (images, audio, video) so that the existence of the hidden data is not obvious. It is a form of obfuscation.");
M("1.4","A company wants an immutable, distributed record of transactions that all participants can verify without a central authority. Which technology BEST fits?",[
["Blockchain (open public ledger)"],
["Certificate revocation list","A CRL is published by a central CA."],
["Key management system","A KMS centrally manages keys; it is not a distributed ledger."],
["Hardware security module","An HSM protects keys; it is not a distributed ledger."]],0,
"A blockchain is a distributed ledger where each block contains a hash of the previous one, making tampering evident; a public ledger lets anyone verify transactions.");
M("1.4","A laptop is lost. The data on the drive cannot be read because every sector, including the operating system, is encrypted. Which encryption level was used?",[
["Full-disk encryption"],
["File-level encryption","File-level encryption protects individual files, not the entire drive including the OS."],
["Database encryption","Database encryption protects data inside a database."],
["Transport encryption","Transport encryption protects data in transit, not on a lost drive."]],0,
"Full-disk encryption (e.g., BitLocker, FileVault) encrypts the entire drive, protecting all data at rest if the device is lost or stolen.");
M("1.4","An organization finds that an internal web server uses a certificate it generated and signed itself. Users receive browser warnings. What is the BEST long-term fix for internal users?",[
["Issue the certificate from the organization's internal CA whose root certificate is distributed to managed devices"],
["Tell users to click through the warning","Training users to ignore certificate warnings makes them vulnerable to on-path attacks."],
["Disable TLS on the server","Removing TLS eliminates confidentiality and integrity protections."],
["Use a longer key length on the self-signed certificate","Key length does not change the fact that browsers do not trust the self-signed issuer."]],0,
"Self-signed certificates have no trusted chain. An internal CA whose root is in the trust store of managed devices provides a root of trust without warnings.");
M("1.4","Which of the following key lengths and algorithms offers comparable security with a SMALLER key size, making it well suited for mobile and IoT devices?",[
["Elliptic curve cryptography (ECC)"],
["RSA","RSA requires much larger keys (e.g., 3072-bit) for similar strength to a 256-bit ECC key."],
["3DES","3DES is a deprecated symmetric cipher."],
["DES","DES uses a 56-bit key and is insecure."]],0,
"ECC provides strength comparable to RSA with much smaller keys, reducing CPU, memory, and power use.");

// Domain 2.0 Threats, Vulnerabilities, and Mitigations
M("2.1","A threat actor with significant funding and advanced capabilities maintains long-term, stealthy access to a defense contractor's network to steal weapons designs. Which threat actor is MOST likely responsible?",[
["Nation-state"],
["Hacktivist","Hacktivists are motivated by causes and typically seek publicity (defacements, leaks), not stealthy long-term espionage."],
["Unskilled attacker","Unskilled attackers use existing tools and lack the resources for persistent, advanced operations."],
["Organized crime","Organized crime is primarily financially motivated; long-term espionage on weapons designs points to a nation-state."]],0,
"Nation-state actors have extensive resources and sophistication and conduct espionage through advanced persistent threats (APTs).");
M("2.1","A group defaces a pharmaceutical company's website with messages protesting animal testing. What is the MOST likely motivation?",[
["Philosophical or political beliefs"],
["Financial gain","There is no ransom or theft for profit described."],
["Espionage","Defacement is public; espionage is covert."],
["War","Acts of war are associated with nation-states targeting adversary nations."]],0,
"Hacktivists act on philosophical or political beliefs and often use defacement and leaks to publicize their cause.");
M("2.1","The marketing department signs up for an unapproved cloud file-sharing service and uploads customer lists without IT's knowledge. What does this represent?",[
["Shadow IT"],
["Nation-state threat","There is no external sophisticated attacker involved."],
["Supply chain attack","A supply chain attack compromises a vendor or product; this is unsanctioned use of a service."],
["Watering hole attack","A watering hole compromises a website frequented by the target group."]],0,
"Shadow IT is the use of IT systems, services, or software without the approval of the IT/security department, creating unmanaged risk.");
M("2.1","A recently terminated database administrator still has VPN access and deletes production tables the day after leaving. Which threat actor and motivation BEST describe this?",[
["Insider threat motivated by revenge"],
["Hacktivist motivated by political beliefs","There is no cause being promoted."],
["Organized crime motivated by financial gain","No financial gain is described, and the actor is a former insider."],
["Unskilled attacker motivated by chaos","The actor used legitimate, retained access, which is characteristic of an insider."]],0,
"A former employee using retained credentials to cause damage is an insider threat, typically motivated by revenge. Prompt de-provisioning mitigates this.");
M("2.1","Which threat actor attribute BEST distinguishes an unskilled attacker from an APT group?",[
["Level of sophistication and resources"],
["Internal versus external","Both are typically external."],
["Use of the internet","Both use the internet."],
["Choice of target operating system","Operating system choice is not a defining attribute."]],0,
"Threat actors are compared by internal/external, resources/funding, and sophistication/capability. Unskilled attackers rely on others' tools; APTs develop custom tooling and have large budgets.");
M("2.2","Employees receive a text message claiming to be from the company's payroll provider with a link to 'confirm direct deposit details.' What type of attack is this?",[
["Smishing"],
["Vishing","Vishing uses voice calls."],
["Whaling","Whaling targets executives specifically, usually via email."],
["Typosquatting","Typosquatting registers misspelled domains; the delivery method here is SMS."]],0,
"Smishing is phishing delivered by SMS/text message.");
M("2.2","An attacker registers the domain 'micros0ft-support.com' and hosts a fake login page. Which technique is this?",[
["Typosquatting"],
["Watering hole","A watering hole compromises a legitimate site the victims already visit."],
["Pretexting","Pretexting is creating a fabricated scenario to manipulate a victim; the domain registration is typosquatting."],
["DNS poisoning","DNS poisoning corrupts DNS records; here a lookalike domain is registered legitimately."]],0,
"Typosquatting (URL hijacking) uses misspelled or lookalike domains to catch users who mistype or don't look closely.");
M("2.2","An attacker compromises an industry forum frequently visited by engineers at a target utility company and plants an exploit on it. What type of attack is this?",[
["Watering hole"],
["Spear phishing","Spear phishing sends targeted messages; here the attacker waits for victims at a site they already visit."],
["Brand impersonation","Brand impersonation pretends to be a known company; this uses a real, compromised site."],
["Typosquatting","No lookalike domain is involved."]],0,
"A watering hole attack compromises a site that the target group is known to visit, infecting visitors.");
M("2.2","The CFO receives an email that appears to come from the CEO's compromised mailbox instructing an urgent wire transfer to a new vendor account. What BEST describes this attack?",[
["Business email compromise"],
["Smishing","Smishing is SMS-based."],
["Vishing","Vishing is voice-based."],
["Watering hole","No compromised website is involved."]],0,
"BEC uses a compromised or spoofed executive or vendor email account to trick employees into transferring money or data. Out-of-band verification of payment changes mitigates it.");
M("2.2","A caller claims to be from the IT help desk, says the user's account will be locked due to a security issue, and asks the user to read back the MFA code just sent to their phone. Which TWO techniques are being used? (Choose two.)",[
["Vishing"],
["Impersonation"],
["Watering hole","No compromised website is involved."],
["Typosquatting","No lookalike domain is involved."],
["Tailgating","Tailgating is a physical entry technique."]],[0,1],
"The attacker uses a voice call (vishing) and pretends to be IT staff (impersonation), combined with urgency, to steal an MFA code.");
M("2.2","A penetration tester leaves USB drives labeled 'Q4 Salaries' in the company parking lot. Which threat vector is being tested?",[
["Removable device"],
["Unsecure wireless network","No wireless network is involved."],
["Default credentials","No default passwords are involved."],
["Open service ports","No network ports are being exploited."]],0,
"Dropping infected removable media (baiting) tests whether users will plug unknown devices into corporate systems.");
M("2.2","A vulnerability scan shows that a network switch is still using the manufacturer's factory username and password. Which attack surface does this represent?",[
["Default credentials"],
["Supply chain","The supply chain refers to vendors and providers that could be compromised."],
["Unsupported system","The switch may still be supported; the issue is its credentials."],
["Agentless vulnerable software","This is about authentication, not client software."]],0,
"Default credentials are publicly documented and are among the first things attackers try. They must be changed during deployment.");
M("2.2","A managed service provider (MSP) with remote management access to dozens of client networks is compromised, and attackers deploy ransomware to its clients. Which threat vector does this describe?",[
["Supply chain"],
["Removable device","No removable media is involved."],
["Watering hole","The attack used the MSP's trusted access, not a compromised website."],
["Bluetooth","No Bluetooth is involved."]],0,
"MSPs, vendors, and suppliers are part of the supply chain; compromising one trusted provider grants access to many downstream customers.");
M("2.2","A social media campaign deliberately spreads fabricated claims that a company's products are causing illness in order to damage its stock price. What is this?",[
["Disinformation"],
["Misinformation","Misinformation is false information spread without intent to deceive; this campaign is deliberate."],
["Pretexting","Pretexting creates a fake scenario to manipulate a specific target into acting."],
["Vishing","Vishing is a voice-based attack."]],0,
"Disinformation is false information spread deliberately to deceive; misinformation is false information spread unintentionally.");
M("2.3","An application copies user input into a fixed-size memory buffer without checking its length, allowing an attacker to overwrite the return address. What vulnerability is this?",[
["Buffer overflow"],
["SQL injection","SQL injection targets database queries."],
["Cross-site scripting","XSS injects scripts into web pages viewed by other users."],
["Race condition","A race condition depends on timing between operations."]],0,
"A buffer overflow occurs when data exceeds a buffer's bounds and overwrites adjacent memory, potentially allowing code execution. Bounds checking, ASLR, and DEP mitigate it.");
M("2.3","A banking application checks the account balance, and then, a few milliseconds later, withdraws funds. An attacker submits two withdrawals simultaneously and both succeed despite insufficient funds. What vulnerability was exploited?",[
["Race condition (TOCTOU)"],
["Memory injection","Memory injection inserts code into a running process's memory."],
["Integer overflow","An integer overflow involves a number exceeding its storage size; the issue here is timing."],
["Directory traversal","Directory traversal accesses files outside the intended directory."]],0,
"A time-of-check to time-of-use (TOCTOU) race condition occurs when the state changes between when it is checked and when it is used. Locking/atomic transactions mitigate it.");
M("2.3","A web form returns all rows from the users table when an attacker enters ' OR 1=1 -- into the username field. Which control BEST prevents this?",[
["Parameterized queries (prepared statements)"],
["Output encoding","Output encoding mitigates XSS, not SQL injection."],
["TLS encryption","TLS protects data in transit; the malicious input still reaches the database."],
["Account lockout","Lockout addresses brute-force attempts, not injection."]],0,
"SQL injection is prevented primarily by parameterized queries, which keep user input as data rather than executable SQL, along with input validation and least-privilege DB accounts.");
M("2.3","A user posts a forum comment containing a <script> tag. When other users view the comment, their session cookies are sent to an attacker's server. What type of attack is this?",[
["Stored (persistent) cross-site scripting"],
["Reflected cross-site scripting","Reflected XSS bounces script off a request (such as a crafted link); here the script is stored on the server."],
["Cross-site request forgery","CSRF forces a user's browser to send an unwanted request; it does not inject script that runs in the page."],
["SQL injection","SQL injection targets database queries."]],0,
"Stored XSS saves malicious script on the server so it runs in every viewer's browser. Output encoding, input validation, CSP, and HttpOnly cookies mitigate it.");
M("2.3","An attacker running code in a guest virtual machine exploits a hypervisor flaw to execute commands on the host and access other VMs. What is this called?",[
["VM escape"],
["Resource reuse","Resource reuse is when memory or storage from one VM is reallocated to another without being cleared."],
["Side loading","Side loading installs apps outside official app stores."],
["Jailbreaking","Jailbreaking removes restrictions on mobile operating systems."]],0,
"VM escape breaks out of a guest's isolation to interact with the hypervisor or other guests, one of the most serious virtualization vulnerabilities.");
M("2.3","An employee installs an app on a corporate Android phone by downloading an APK from a website instead of the official store. What is this practice called?",[
["Side loading"],
["Jailbreaking","Jailbreaking (iOS) or rooting (Android) removes OS restrictions; installing an APK from a website is side loading."],
["Bluejacking","Bluejacking sends unsolicited Bluetooth messages."],
["Tethering","Tethering shares a cellular connection."]],0,
"Side loading installs apps from outside the official app store, bypassing store vetting. MDM policies can block it.");
M("2.3","A vendor has announced that a firewall model will no longer receive security patches after this year. Which vulnerability category will the firewall fall under after that date?",[
["End-of-life (EOL) hardware"],
["Zero-day","A zero-day is a vulnerability unknown to the vendor with no patch available; EOL is a lifecycle status."],
["Misconfiguration","Nothing is misconfigured."],
["Cryptographic","The issue is the lack of vendor support, not cryptography."]],0,
"End-of-life systems no longer receive updates, so any newly found vulnerabilities will remain unpatched. They should be replaced or isolated with compensating controls.");
M("2.3","Attackers exploit a flaw in a popular VPN appliance that the vendor did not know about and for which no patch exists. What type of vulnerability is this?",[
["Zero-day"],
["Legacy","Legacy refers to old systems; this flaw is unknown, not old."],
["Misconfiguration","Misconfiguration is a setup error by the administrator."],
["Known CVE with available patch","By definition, no patch exists here."]],0,
"A zero-day vulnerability is unknown to the vendor or has no available fix, so there are zero days of protection.");
M("2.3","A cloud storage bucket containing customer records is accessible to anyone on the internet because its permissions were set to public. What is the root cause?",[
["Misconfiguration"],
["Zero-day vulnerability","Nothing unknown was exploited; this is a settings error."],
["VM escape","No hypervisor breakout occurred."],
["Race condition","No timing issue is involved."]],0,
"Misconfigured cloud resources (public buckets, overly permissive security groups) are among the most common causes of cloud data exposure.");
M("2.3","Attackers compromise a software vendor's build server and insert a backdoor into a legitimate, digitally signed update that customers install automatically. What type of vulnerability does this represent?",[
["Malicious update (software supply chain)"],
["Side loading","The update came through the official channel."],
["Buffer overflow","No memory corruption is described."],
["Default credentials","No default passwords are involved."]],0,
"A malicious update delivered through the vendor's legitimate update mechanism is a software supply chain compromise; signing proves origin, not that the build was clean.");
M("2.3","Which of the following is a firmware-related vulnerability?",[
["A BIOS/UEFI flaw that allows persistent malware to survive OS reinstallation"],
["A SQL injection flaw in a web application","That is a web application vulnerability."],
["A weak password on a user account","That is an authentication/configuration issue."],
["An unencrypted wireless network","That is a network configuration issue."]],0,
"Firmware runs below the operating system; compromised firmware can persist through OS reinstalls and evade OS-level security tools.");
M("2.4","Users report that their files have been renamed with a .locked extension and a text file demands payment in cryptocurrency. What type of malware is MOST likely involved?",[
["Ransomware"],
["Spyware","Spyware secretly collects information; it does not encrypt files and demand payment."],
["Logic bomb","A logic bomb executes when a condition is met, but the ransom demand indicates ransomware."],
["Rootkit","A rootkit hides malicious activity and maintains privileged access."]],0,
"Ransomware encrypts data and demands payment for the decryption key. Offline, immutable backups are a key mitigation.");
M("2.4","A malicious program spreads automatically across the network by exploiting an SMB vulnerability, without any user interaction. What type of malware is this?",[
["Worm"],
["Virus","A virus requires a host file and typically user action to spread."],
["Trojan","A Trojan disguises itself as legitimate software and requires the user to run it."],
["Keylogger","A keylogger records keystrokes; it does not self-propagate."]],0,
"Worms self-replicate and spread over networks by exploiting vulnerabilities, without user interaction.");
M("2.4","A developer who was told he would be laid off inserted code that deletes the payroll database if his account is ever disabled. What is this code called?",[
["Logic bomb"],
["Worm","A worm self-propagates across networks."],
["Trojan","A Trojan masquerades as legitimate software to trick users into running it."],
["Bloatware","Bloatware is unwanted, pre-installed software."]],0,
"A logic bomb is malicious code that triggers when a specific condition (date, event, account status) is met.");
M("2.4","An EDR tool cannot see a malicious process, but an offline scan from bootable media finds modified kernel drivers that hide files and processes. What type of malware is MOST likely present?",[
["Rootkit"],
["Adware","Adware displays advertisements and does not hide at the kernel level."],
["Worm","Worms are defined by self-propagation, not concealment."],
["Ransomware","Ransomware announces itself with a ransom demand."]],0,
"Rootkits modify the OS or kernel to hide their presence and maintain privileged access, which is why offline/out-of-band scans can reveal them.");
M("2.4","A new laptop arrives from the manufacturer with several trial programs and utilities the user never requested, consuming resources. What is this called?",[
["Bloatware"],
["Spyware","Spyware covertly collects information; pre-installed unwanted software is bloatware."],
["Rootkit","Rootkits hide malicious activity."],
["Logic bomb","Logic bombs are triggered malicious code."]],0,
"Bloatware is unnecessary pre-installed software. It expands the attack surface and should be removed as part of hardening.");
M("2.4","A user downloads a 'free PDF converter' that works as advertised but also opens a reverse shell to an attacker. What type of malware is this?",[
["Trojan"],
["Worm","A worm spreads on its own; this required the user to install it."],
["Logic bomb","No trigger condition is described."],
["Bloatware","Bloatware is unwanted software, not a backdoor."]],0,
"A Trojan appears to be legitimate, useful software but contains hidden malicious functionality, such as a remote access Trojan (RAT).");
M("2.4","The SIEM shows a single user account authenticated from New York and, eight minutes later, from Singapore. What indicator is this?",[
["Impossible travel"],
["Account lockout","No lockout is mentioned."],
["Resource consumption","No resource spike is mentioned."],
["Out-of-cycle logging","Out-of-cycle logging refers to log entries at unexpected times or frequencies."]],0,
"Impossible travel is when logins occur from geographic locations too far apart to travel between in the elapsed time, indicating credential compromise.");
M("2.4","An authentication log shows one failed login attempt for each of 3,000 different accounts using the password 'Winter2026!', all from the same IP address within an hour. Which attack is this?",[
["Password spraying"],
["Brute force against a single account","Brute force tries many passwords against one account; here one password is tried against many accounts."],
["Credential replay","Replay reuses captured authentication data such as hashes or tokens."],
["Dictionary attack against a single account","A dictionary attack tries many words against one account."]],0,
"Password spraying tries a few common passwords against many accounts to avoid triggering per-account lockout thresholds.");
M("2.4","A web server log shows requests like GET /download.php?file=../../../../etc/passwd. What type of attack is being attempted?",[
["Directory traversal"],
["SQL injection","There is no SQL syntax in the request."],
["Cross-site request forgery","CSRF abuses a victim's authenticated session to submit requests."],
["Buffer overflow","No oversized input is present."]],0,
"Directory (path) traversal uses ../ sequences to access files outside the web root. Input validation and canonicalization mitigate it.");
M("2.4","An attacker sends small DNS queries with a spoofed source IP address of the victim to many open resolvers, which send large responses to the victim. What attack is this?",[
["Reflected and amplified DDoS"],
["DNS poisoning","DNS poisoning corrupts DNS records to redirect users; this floods the victim with traffic."],
["On-path attack","An on-path attack intercepts traffic between two parties."],
["Credential replay","No credentials are involved."]],0,
"Reflection uses spoofed source addresses so third-party servers send responses to the victim; amplification uses protocols whose responses are much larger than the requests.");
M("2.4","Users on a network are redirected to a fake banking site even though they typed the correct URL. The DNS server's cache was found to contain a forged record for the bank. What attack occurred?",[
["DNS cache poisoning"],
["Typosquatting","Users typed the correct URL, so no misspelled domain was used."],
["Domain hijacking","Domain hijacking takes control of the domain registration itself; here only a resolver cache was corrupted."],
["ARP poisoning","ARP poisoning works at layer 2 on a local network, not on DNS records."]],0,
"DNS cache poisoning inserts false records into a resolver's cache to redirect users. DNSSEC helps validate DNS responses.");
M("2.4","An attacker on the same Wi-Fi network sends forged ARP replies so that traffic for the default gateway is sent to the attacker's machine. What is the attacker MOST likely attempting?",[
["An on-path (man-in-the-middle) attack"],
["A DDoS attack","The goal is to intercept traffic, not overwhelm a target."],
["A replay attack","Replay re-sends captured data; ARP poisoning is used to position oneself to intercept."],
["A directory traversal attack","Directory traversal targets web applications."]],0,
"ARP poisoning associates the attacker's MAC address with the gateway's IP, placing the attacker on-path to intercept or modify traffic. Dynamic ARP inspection mitigates it.");
M("2.4","An attacker captures a user's NTLM hash and uses it to authenticate to another server without cracking it. What attack is this?",[
["Pass-the-hash (credential replay)"],
["Password spraying","Password spraying guesses common passwords."],
["Birthday attack","A birthday attack exploits hash collisions."],
["Downgrade attack","A downgrade attack forces a weaker protocol version."]],0,
"Pass-the-hash replays a captured credential hash to authenticate, a form of credential replay.");
M("2.4","During a TLS handshake, an on-path attacker manipulates the negotiation so the client and server use an older, weaker protocol version. What type of attack is this?",[
["Downgrade attack"],
["Collision attack","A collision attack finds two inputs that produce the same hash."],
["Birthday attack","A birthday attack is a probabilistic method for finding hash collisions."],
["Replay attack","A replay attack resends captured data."]],0,
"Downgrade attacks force the use of weaker protocols or ciphers. Disabling legacy protocols on servers and clients mitigates them.");
M("2.4","A security researcher finds two different documents that produce the same MD5 hash value. What has been demonstrated?",[
["A collision"],
["A downgrade","A downgrade forces weaker protocols."],
["Key stretching","Key stretching strengthens passwords by repeated hashing."],
["Salting","Salting adds random data to a password before hashing."]],0,
"A collision occurs when two different inputs produce the same hash, undermining integrity checks and signatures. MD5 and SHA-1 are vulnerable.");
M("2.4","A standard user exploits a misconfigured service running as SYSTEM to gain administrator rights on a workstation. What is this?",[
["Privilege escalation (vertical)"],
["Horizontal privilege escalation","Horizontal escalation accesses another user's resources at the same privilege level; this gained higher privileges."],
["Directory traversal","No file path manipulation is described."],
["Replay attack","No captured data is resent."]],0,
"Vertical privilege escalation moves from a lower to a higher privilege level, such as from user to administrator/SYSTEM.");
M("2.4","A user who is logged into her bank clicks a link on a malicious website, and her browser silently submits a funds-transfer request to the bank using her session cookie. What attack is this?",[
["Cross-site request forgery (CSRF)"],
["Stored XSS","XSS injects script into the trusted site; here a request is forged from another site."],
["SQL injection","No database query manipulation is involved."],
["Session replay from network capture","The cookie was not captured; the browser sent it automatically."]],0,
"CSRF tricks an authenticated user's browser into sending unwanted requests. Anti-CSRF tokens and SameSite cookies mitigate it.");
M("2.4","An attacker uses a handheld reader to copy the data from an employee's proximity badge while standing next to them in line at a coffee shop. What attack is this?",[
["RFID cloning"],
["Bluesnarfing","Bluesnarfing steals data via Bluetooth."],
["Tailgating","Tailgating follows someone through a door."],
["Shoulder surfing","Shoulder surfing visually observes information."]],0,
"RFID cloning reads and duplicates the credential stored on a badge. Encrypted/mutually authenticated cards and shielded sleeves help mitigate.");
M("2.4","A security analyst notices that the security logs on a domain controller have a 6-hour gap overnight, and the audit policy was briefly disabled. What is the MOST likely explanation?",[
["An attacker tampered with logging to hide activity"],
["Impossible travel","Impossible travel concerns login locations."],
["Normal log rotation","Log rotation does not disable the audit policy or create unexplained gaps."],
["Resource exhaustion","Nothing indicates a resource problem."]],0,
"Missing logs and disabled auditing are indicators of compromise because attackers frequently clear or stop logging to cover their tracks. Forwarding logs to a SIEM preserves them.");
M("2.4","A user receives an account lockout notification for her account even though she has not attempted to log in for days. What does this MOST likely indicate?",[
["Someone is attempting to guess her password"],
["Her password expired","Expiration prompts a password change; it does not lock the account."],
["Concurrent session usage","Concurrent sessions are simultaneous logins; lockouts come from failed attempts."],
["A certificate was revoked","Certificate revocation does not lock an account."]],0,
"Unexpected account lockouts indicate failed authentication attempts, often a brute-force attack against the account.");
M("2.4","A server's CPU usage is pegged at 100% and outbound traffic to an unknown pool address on port 3333 has been constant for weeks. Which malware is MOST likely present?",[
["Cryptominer (cryptojacking)"],
["Keylogger","Keyloggers use minimal resources."],
["Logic bomb","A logic bomb executes once on a trigger."],
["Ransomware","Ransomware would encrypt files and demand payment."]],0,
"Sustained high resource consumption with connections to a mining pool indicates cryptojacking malware using the victim's resources.");
M("2.5","A company wants to ensure that only approved applications can run on its point-of-sale terminals. Which mitigation BEST achieves this?",[
["Application allow list"],
["Antivirus deny list","A deny list only blocks known-bad software; unknown malware can still run."],
["Full-disk encryption","Encryption protects data at rest, not which applications run."],
["Host-based firewall","A firewall controls network traffic, not application execution."]],0,
"An allow list permits only explicitly approved applications to execute; everything else is blocked by default. This is ideal for fixed-function systems.");
M("2.5","Which of the following hardening techniques MOST directly reduces the attack surface of a newly deployed server?",[
["Disabling unused services and closing unnecessary ports"],
["Enabling verbose logging","Logging improves detection but doesn't reduce the attack surface."],
["Installing a second network card","Additional interfaces may increase the attack surface."],
["Joining the server to the domain","Domain membership enables central management but does not by itself remove exposed services."]],0,
"Removing unnecessary software, services, and open ports reduces the number of potential entry points an attacker can use.");
M("2.5","After a breach, an organization wants to prevent a compromise of its guest Wi-Fi from reaching the corporate file servers. Which mitigation is MOST appropriate?",[
["Network segmentation"],
["Data masking","Masking obscures data values; it doesn't restrict network paths."],
["Patching","Patching fixes software flaws but doesn't separate networks."],
["Decommissioning","Decommissioning removes systems from service."]],0,
"Segmentation (VLANs, firewalls, ACLs) separates networks so a compromise in one zone can't easily spread to another.");
M("2.5","A server running an unsupported OS cannot be retired for six months because a critical app depends on it. Which approach BEST reduces the risk in the meantime?",[
["Isolate it on a restricted network segment with strict ACLs and enhanced monitoring"],
["Remove its antivirus to improve performance","This increases risk."],
["Expose it to the internet for vendor access","This greatly increases risk."],
["Accept the risk without any additional controls","Isolation and monitoring provide inexpensive risk reduction; accepting with no controls is not the best approach."]],0,
"Isolation and segmentation limit what can reach the unsupported system, and monitoring detects attempts, serving as compensating controls until it is decommissioned.");
M("2.5","Which of the following is the BEST example of applying the principle of least privilege?",[
["A help desk technician can reset passwords but cannot modify domain admin group membership"],
["All IT staff are members of Domain Admins for convenience","This grants excessive privilege."],
["Users have local admin rights to install software","Local admin rights exceed what most users need."],
["Service accounts run with full administrator rights","Service accounts should have only the rights they require."]],0,
"Least privilege grants only the minimum permissions needed to perform a job function.");
M("2.5","A company ensures that a decommissioned database server's drives are wiped and that the server is removed from DNS, firewall rules, and the asset inventory. What mitigation technique is this?",[
["Decommissioning"],
["Configuration enforcement","Configuration enforcement keeps active systems compliant with baselines."],
["Monitoring","Monitoring watches active systems."],
["Isolation","Isolation separates active systems."]],0,
"Proper decommissioning removes the system from service and cleans up associated data, access, and records so it cannot become a forgotten attack vector.");
M("2.5","An administrator wants to block a known malicious executable on endpoints and also detect behavior such as code injecting into lsass.exe. Which tool installed on endpoints BEST provides both?",[
["Host-based intrusion prevention system (HIPS) / endpoint protection"],
["Network firewall","A network firewall cannot see process behavior on endpoints."],
["NetFlow collector","NetFlow provides network flow metadata only."],
["Web application firewall","A WAF protects web applications."]],0,
"HIPS/endpoint protection monitors host activity, blocking known-bad files and suspicious behaviors such as credential dumping.");
M("2.5","A security team uses configuration management tooling to automatically revert any server whose settings drift from the approved baseline. What mitigation technique is this?",[
["Configuration enforcement"],
["Decommissioning","Decommissioning removes systems from service."],
["Segmentation","Segmentation separates networks."],
["Encryption","Encryption protects data confidentiality."]],0,
"Configuration enforcement ensures systems remain compliant with the secure baseline, automatically correcting drift.");
M("2.2","An attacker sends an email that appears to come from a well-known shipping company, including its logo and color scheme, asking recipients to pay a 'redelivery fee.' What technique is this?",[
["Brand impersonation"],
["Watering hole","A watering hole compromises a legitimate site."],
["Business email compromise","BEC uses a compromised or spoofed internal/vendor account for financial fraud, not a mass-mailed brand lookalike."],
["Tailgating","Tailgating is physical."]],0,
"Brand impersonation mimics a trusted company's look and feel to trick victims.");
M("2.2","An attacker exploits a vulnerability in a corporate laptop's Bluetooth stack from a nearby café table to gain access to files. Which attack surface was exploited?",[
["Unsecure network (Bluetooth)"],
["Removable device","No removable media is involved."],
["Supply chain","No vendor was compromised."],
["Image-based vector","No malicious images are involved."]],0,
"Bluetooth is a wireless attack surface; disabling it when not needed and keeping firmware patched reduces risk. Bluesnarfing is unauthorized data access via Bluetooth.");
M("2.2","Which of the following BEST describes the difference between agent-based and agentless software as attack surfaces?",[
["Agent-based software runs locally on the client and must be patched there; agentless solutions are accessed remotely, often through a browser, so vulnerabilities lie on the server side"],
["Agentless software is always more secure","Neither model is inherently more secure."],
["Agent-based software cannot have vulnerabilities","Any software can have vulnerabilities."],
["Agentless software runs only on mobile devices","Agentless refers to having no installed client, not a device type."]],0,
"Client-based (agent) software creates a vulnerability footprint on every endpoint; agentless approaches shift the attack surface to the server/service.");
M("2.1","A criminal group deploys ransomware on a hospital and demands payment, threatening to publish stolen patient data if not paid. Which TWO motivations are MOST evident? (Choose two.)",[
["Financial gain"],
["Blackmail"],
["Espionage","Espionage is covert intelligence gathering; this attack is overt and extortion-focused."],
["Philosophical beliefs","There is no ideological cause."],
["War","There is no indication of nation-state conflict."]],[0,1],
"Double-extortion ransomware is financially motivated and uses blackmail (threatening to leak data) to pressure victims.");
M("2.3","A web application allows a user to change the 'id' parameter in the URL from 1001 to 1002 and view another customer's invoice. Which vulnerability is this?",[
["Insecure direct object reference / broken access control"],
["Buffer overflow","No memory corruption is involved."],
["Race condition","No timing issue is involved."],
["Cryptographic failure","No encryption weakness is described."]],0,
"The application fails to verify that the user is authorized to access the requested object. Server-side authorization checks fix it.");
M("2.3","A cryptographic vulnerability scan finds that a server still accepts SSL 3.0 and TLS 1.0 connections with RC4 ciphers. What is the BEST remediation?",[
["Disable legacy protocols and weak ciphers, allowing only TLS 1.2/1.3 with strong cipher suites"],
["Increase the RSA key length to 8192 bits","Longer keys don't fix weak protocols and ciphers."],
["Add a WAF in front of the server","A WAF inspects HTTP but doesn't correct the server's TLS configuration."],
["Change the certificate to a wildcard","Certificate type doesn't affect supported protocols."]],0,
"Weak protocols and ciphers enable downgrade and decryption attacks; they must be disabled in the server configuration.");

// Domain 3.0 Security Architecture
M("3.1","A company moves its application to an IaaS provider. Under the shared responsibility model, which of the following is the CUSTOMER responsible for securing?",[
["The guest operating system, applications, and data"],
["The physical data center facilities","Physical security is always the provider's responsibility in public cloud."],
["The hypervisor","The provider manages the virtualization layer in IaaS."],
["The physical network hardware","The provider owns and secures physical networking."]],0,
"In IaaS, the provider secures physical infrastructure and virtualization; the customer secures the OS, middleware, applications, identities, and data.");
M("3.1","In a SaaS deployment such as a hosted email service, which responsibility ALWAYS remains with the customer?",[
["Managing user accounts, access permissions, and the data they store"],
["Patching the email server software","The SaaS provider patches the application."],
["Securing the underlying operating system","The provider manages the OS in SaaS."],
["Maintaining data center power and cooling","That is the provider's responsibility."]],0,
"Even in SaaS, the customer retains responsibility for its data, identities, and access configuration.");
M("3.1","A DevOps team defines servers, networks, and firewall rules in version-controlled template files that are deployed automatically. What is this practice called, and what is a key security benefit?",[
["Infrastructure as code; consistent, repeatable, reviewable configurations"],
["Serverless computing; no code to secure","Serverless still involves code, and this describes infrastructure templates."],
["Microservices; a single point of failure is created","Microservices break applications into services; the description is IaC."],
["Air gapping; no network connectivity","IaC does not imply isolation."]],0,
"IaC allows infrastructure to be defined in code, peer-reviewed, scanned for misconfigurations, and deployed identically, reducing drift and human error.");
M("3.1","Which architecture runs code as individual functions triggered by events, with the cloud provider managing all servers and scaling?",[
["Serverless"],
["Microservices on virtual machines","Microservices can run on VMs the customer manages; serverless removes server management entirely."],
["On-premises monolith","A monolith is a single deployable application, usually on servers the organization manages."],
["Air-gapped network","Air gapping is network isolation."]],0,
"Serverless (Function as a Service) shifts server management to the provider; security focus shifts to code, permissions, and event inputs.");
M("3.1","A water treatment plant uses programmable logic controllers that cannot be patched without halting operations. Which approach is MOST appropriate to protect them?",[
["Segment the ICS network from the corporate network and strictly control and monitor access"],
["Install standard antivirus on each PLC","PLCs generally cannot run standard endpoint software."],
["Connect the PLCs directly to the internet for vendor support","Direct exposure greatly increases risk."],
["Apply patches immediately during production","Uncontrolled patching can disrupt safety-critical processes."]],0,
"ICS/SCADA systems often cannot be patched easily. Segmentation, strict access control, and monitoring are primary compensating controls.");
M("3.1","A classified research network has no physical or wireless connection to any other network. What is this design called?",[
["Air-gapped"],
["Screened subnet","A screened subnet (DMZ) is connected to both the internet and internal networks via firewalls."],
["Software-defined networking","SDN separates the control and data planes; it is not isolation."],
["Logical segmentation","Logical segmentation (VLANs) shares physical infrastructure."]],0,
"An air gap physically isolates a network. Removable media and insiders remain risks.");
M("3.1","Which of the following is a security advantage of containerization compared to installing many applications directly on one host?",[
["Each application runs in an isolated container with its own dependencies, limiting the impact of a single compromised app"],
["Containers each run their own full guest OS kernel","Containers share the host kernel; VMs run separate kernels."],
["Containers cannot contain vulnerabilities","Container images can include vulnerable packages and must be scanned."],
["Containers eliminate the need for patching","Images must be rebuilt and updated regularly."]],0,
"Containers isolate applications and dependencies; because they share the host kernel, kernel vulnerabilities and container escape remain concerns.");
M("3.1","A real-time operating system (RTOS) controls a car's braking system. Which statement BEST describes a security challenge for RTOS devices?",[
["They have strict timing requirements and limited resources, making traditional security tools and frequent patching difficult"],
["They always run full desktop antivirus","RTOS devices generally cannot run such tools."],
["They are never connected to networks","Many RTOS devices are networked (e.g., vehicle CAN buses, telematics)."],
["They have unlimited compute power","They are typically resource-constrained."]],0,
"RTOS and embedded systems prioritize deterministic timing; limited compute and power constrain security options.");
M("3.1","A company is choosing between on-premises and cloud for a new system. Which consideration MOST favors the cloud?",[
["Rapid scalability and ease of deployment"],
["Full control over physical hardware","On-premises offers more physical control."],
["Guaranteed data never leaves the building","That favors on-premises."],
["No responsibility for any security configuration","Customers always retain some security responsibilities."]],0,
"Cloud deployments offer elastic scalability and fast deployment, while on-premises offers more direct control.");
M("3.1","An IoT smart thermostat ships with a hard-coded password and a vendor that rarely releases firmware updates. What is the BEST way to reduce the risk it poses to the corporate network?",[
["Place IoT devices on a separate, restricted network segment"],
["Give the thermostat a static public IP address","Public exposure increases risk."],
["Install endpoint DLP on the thermostat","IoT devices usually cannot run such agents."],
["Ignore it because IoT devices are low value","Compromised IoT devices are often used as pivot points or botnet nodes."]],0,
"IoT devices often have weak defaults and limited patching; segmentation limits their reach.");
M("3.1","Which statement about software-defined networking (SDN) is CORRECT?",[
["It separates the control plane from the data plane, allowing centralized, programmable network management"],
["It requires physically rewiring the network for every change","SDN makes changes through software."],
["It eliminates the need for network security","SDN still requires controls; the controller itself is a high-value target."],
["It only works in air-gapped environments","SDN is widely used in data centers and clouds."]],0,
"SDN centralizes control, enabling rapid policy changes; protecting the SDN controller is critical.");
M("3.2","A company needs a single hardened, monitored host that administrators must connect through before managing servers in a secure zone. What is this host called?",[
["Jump server"],
["Forward proxy","A forward proxy mediates user web requests."],
["Load balancer","A load balancer distributes traffic."],
["Honeypot","A honeypot is a decoy."]],0,
"A jump server (jump box/bastion host) is the controlled entry point for administrative access to a secure zone.");
M("3.2","A firewall protecting a hospital's life-safety system loses power. The security team requires that the device continue passing traffic so medical systems keep working. Which failure mode is this?",[
["Fail-open"],
["Fail-closed","Fail-closed blocks all traffic on failure."],
["Fail-secure","Fail-secure is another term for fail-closed."],
["Active-passive","Active-passive describes an HA configuration."]],0,
"Fail-open allows traffic when a device fails, prioritizing availability; fail-closed blocks traffic, prioritizing security.");
M("3.2","An IDS sensor receives a copy of traffic from a switch SPAN port and alerts on suspicious activity. Which statement about this deployment is TRUE?",[
["It is a passive, out-of-band device that can detect but not directly block traffic"],
["It is inline and will block malicious packets","A SPAN-connected sensor sees a copy of traffic and is not inline."],
["It will cause an outage if it fails","Because it is not inline, its failure does not interrupt traffic."],
["It encrypts traffic between hosts","IDS devices do not encrypt traffic."]],0,
"Tap/monitor (passive) deployments receive copies of traffic. Inline (active) devices like an IPS can block traffic but can affect availability.");
M("3.2","A company wants to authenticate devices before they receive network access on any wired switch port, using credentials checked against a RADIUS server. Which technology should be implemented?",[
["IEEE 802.1X"],
["Port mirroring","Port mirroring copies traffic for monitoring."],
["MAC flooding","MAC flooding is an attack."],
["Spanning Tree Protocol","STP prevents switching loops."]],0,
"802.1X provides port-based network access control: the supplicant authenticates via an authenticator (switch/AP) to an authentication server (RADIUS), typically using EAP.");
M("3.2","A company wants to protect a public web application from SQL injection and XSS by inspecting HTTP requests. Which device is MOST appropriate?",[
["Web application firewall"],
["Layer 4 stateful firewall","A layer 4 firewall filters by IP/port and cannot inspect HTTP payloads for injection."],
["NetFlow collector","NetFlow records traffic metadata only."],
["Network TAP","A TAP copies traffic; it does not block attacks."]],0,
"A WAF operates at layer 7 and inspects HTTP/S traffic for application attacks like SQLi and XSS.");
M("3.2","Which firewall can identify and control traffic by application (for example, allowing a SaaS app but blocking file uploads to it), regardless of port?",[
["Next-generation firewall (layer 7)"],
["Packet-filtering firewall","Packet filters only check header fields like IP and port."],
["Layer 4 stateful firewall","Stateful firewalls track connections but don't identify applications."],
["Network-based load balancer","Load balancers distribute traffic."]],0,
"NGFWs perform application awareness, deep packet inspection, and often user identity and IPS.");
M("3.2","A small business wants a single appliance that combines firewall, IPS, antivirus gateway, content filtering, and VPN. Which device fits BEST?",[
["Unified threat management (UTM)"],
["Web application firewall","A WAF only protects web applications."],
["Jump server","A jump server is for administrative access."],
["Network TAP","A TAP copies traffic."]],0,
"UTM appliances consolidate multiple security functions into one device, simplifying management for smaller organizations (at the cost of a single point of failure).");
M("3.2","Remote employees need secure access to internal applications. The company wants only corporate traffic to go through the VPN while personal internet traffic goes directly out. What is this configuration called?",[
["Split tunnel"],
["Full tunnel","A full tunnel sends all traffic through the VPN."],
["Site-to-site VPN","Site-to-site VPNs connect networks, not individual remote users."],
["Transport mode","IPSec transport mode encrypts only the payload; it doesn't define routing of traffic."]],0,
"A split tunnel sends only corporate-destined traffic over the VPN. A full tunnel routes all traffic through the corporate network for inspection.");
M("3.2","Which IPSec component provides both encryption and integrity for the payload of packets?",[
["Encapsulating Security Payload (ESP)"],
["Authentication Header (AH)","AH provides integrity and authentication but not encryption."],
["Internet Key Exchange (IKE)","IKE negotiates security associations and keys."],
["Generic Routing Encapsulation (GRE)","GRE is a tunneling protocol without encryption."]],0,
"ESP provides confidentiality (encryption), integrity, and authentication. AH provides integrity/authentication only.");
M("3.2","A company with many branch offices wants to combine SD-WAN with cloud-delivered security services such as SWG, CASB, ZTNA, and firewall-as-a-service. Which architecture describes this?",[
["Secure access service edge (SASE)"],
["Screened subnet","A screened subnet is a DMZ network design."],
["Air gap","An air gap is isolation."],
["Jump server","A jump server provides admin access."]],0,
"SASE converges networking (SD-WAN) and cloud-delivered security services, enforcing policy close to users wherever they are.");
M("3.2","A company places its public web and email servers in a network segment between two firewalls, separate from the internal LAN. What is this segment called?",[
["Screened subnet (DMZ)"],
["Intranet","An intranet is an internal network."],
["Honeynet","A honeynet is a decoy network."],
["VLAN trunk","A trunk carries multiple VLANs between switches."]],0,
"A screened subnet hosts internet-facing services so that a compromise does not give direct access to the internal network.");
M("3.2","A company deploys a reverse proxy in front of its internal web servers. Which is a security benefit?",[
["It hides the internal servers and can terminate TLS and filter requests before they reach the servers"],
["It filters employees' outbound web browsing","That's a forward proxy."],
["It replaces the need for authentication","Authentication is still required."],
["It provides a VPN for remote users","A reverse proxy is not a VPN."]],0,
"A reverse proxy accepts inbound requests on behalf of servers, hiding them and providing centralized TLS, caching, and filtering.");
M("3.2","An organization deploys two firewalls in an active-passive pair. What is the primary purpose of this configuration?",[
["High availability if the active firewall fails"],
["Doubling throughput by load sharing","That describes active-active."],
["Running different rule sets for different users","HA pairs synchronize the same configuration."],
["Isolating guest traffic","Segmentation is done through zones/VLANs."]],0,
"In active-passive, the standby unit takes over if the active unit fails.");
M("3.2","A security architect is placing a network IPS. Where should it be deployed to block malicious traffic from the internet before it reaches internal hosts?",[
["Inline, behind the perimeter firewall on the path to the internal network"],
["On a SPAN port of an internal switch","SPAN-connected sensors are passive and cannot block traffic inline."],
["On each user's workstation","That would be HIPS, not network IPS."],
["In an air-gapped segment","An air-gapped IPS sees no internet traffic."]],0,
"An IPS must be inline to drop malicious packets; placing it behind the firewall reduces noise from traffic already blocked.");
M("3.3","A company's customer database includes names, Social Security numbers, and medical histories. Which data type BEST describes this information?",[
["Regulated data"],
["Public data","This information is sensitive and legally protected."],
["Trade secret","Trade secrets are proprietary business information, not customer data."],
["Non-human-readable data","This data is readable by humans."]],0,
"Regulated data (PII, PHI, financial data) is subject to laws and regulations governing its handling, such as HIPAA and GDPR.");
M("3.3","A secret recipe that gives a company a competitive advantage and is protected by NDAs is BEST classified as which data type?",[
["Trade secret"],
["Regulated data","Regulated data is governed by law, such as PII or PHI."],
["Public data","It is not meant to be public."],
["Legal information","Legal information relates to legal matters and proceedings."]],0,
"Trade secrets are confidential business information that provides a competitive advantage and is protected through secrecy.");
M("3.3","Data loaded into a server's RAM for processing is in which state?",[
["Data in use"],
["Data at rest","Data at rest is stored on media."],
["Data in transit","Data in transit is moving across a network."],
["Data in archive","Archived data is at rest."]],0,
"Data in use is being processed in memory or by the CPU. Protections include secure enclaves and memory protection.");
M("3.3","A European company is required by law to keep its citizens' personal data stored on servers located within the EU. What concept does this describe?",[
["Data sovereignty"],
["Data masking","Data masking obscures data."],
["Tokenization","Tokenization substitutes data with tokens."],
["Data classification","Classification labels data by sensitivity."]],0,
"Data sovereignty means data is subject to the laws of the country where it is collected or stored, which may require it to remain in that jurisdiction.");
M("3.3","A call center agent's screen shows a customer's credit card as XXXX-XXXX-XXXX-4421. Which data protection method is used?",[
["Data masking"],
["Hashing","A hash would show a fixed-length digest, not a partially visible number."],
["Encryption","Encrypted data appears as ciphertext."],
["Steganography","Steganography hides data inside other files."]],0,
"Data masking hides part of the data while leaving enough visible for the business task.");
M("3.3","A file server administrator wants to ensure that only HR staff can open files in the HR share. Which method is MOST appropriate?",[
["Permission restrictions (ACLs)"],
["Geographic restrictions","Geographic restrictions are based on location, not role."],
["Hashing","Hashing provides integrity, not access control."],
["Steganography","Steganography hides data."]],0,
"NTFS/share permissions or ACLs restrict access to authorized users and groups.");
M("3.3","A streaming service blocks access to certain content for users connecting from outside licensed countries based on IP address location. Which method is being used?",[
["Geographic restrictions (geolocation)"],
["Data masking","Masking obscures data."],
["Tokenization","Tokenization substitutes data."],
["Segmentation","Segmentation separates networks."]],0,
"Geographic restrictions use the user's location (often via IP geolocation) to allow or block access.");
M("3.3","A company labels its unreleased merger plans so that only a handful of named executives may view them, and disclosure could cause severe financial and legal harm. Which classification is MOST appropriate?",[
["Restricted"],
["Public","Public data may be freely disclosed."],
["Private","Private typically refers to personal information about individuals, not highly sensitive corporate plans."],
["Internal use only","Internal data can be shared broadly among employees, which is far too permissive here."]],0,
"The most sensitive commercial data, accessible only to specific individuals and whose disclosure would cause severe harm, is classified as restricted (higher than confidential/sensitive).");
M("3.3","Which protection BEST secures data in transit between a mobile app and an API server?",[
["TLS"],
["Full-disk encryption","FDE protects data at rest on the device."],
["Data masking","Masking hides display values."],
["File permissions","Permissions protect files at rest."]],0,
"TLS encrypts data in transit, providing confidentiality and integrity between client and server.");
M("3.4","A company has a secondary site with power, network connectivity, and some hardware, but systems must be configured and data restored before it can operate. What type of site is this?",[
["Warm site"],
["Hot site","A hot site is fully equipped with current data and can take over almost immediately."],
["Cold site","A cold site has basic space and power but little or no equipment."],
["Mobile site","A mobile site is a portable facility."]],0,
