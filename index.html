"Warm sites offer a middle ground in cost and recovery time between hot and cold sites.");
M("3.4","Which recovery site has the HIGHEST cost but the LOWEST recovery time?",[
["Hot site"],
["Warm site","A warm site requires setup and data restoration."],
["Cold site","A cold site has the longest recovery time and lowest cost."],
["Offsite tape vault","A tape vault stores backups; it is not an operational site."]],0,
"A hot site is fully configured with near-real-time data replication, allowing near-immediate failover.");
M("3.4","An administrator performs a full backup every Sunday and differential backups Monday through Saturday. The server fails Thursday morning. Which backups are needed to restore?",[
["Sunday's full backup and Wednesday's differential"],
["Sunday's full and Monday, Tuesday, and Wednesday's differentials","Differentials are cumulative since the last full backup; only the latest one is needed."],
["Only Wednesday's differential","A differential needs the full backup it is based on."],
["Only Sunday's full backup","That would lose the changes made Monday–Wednesday."]],0,
"A differential backup contains all changes since the last full backup, so restoration needs the full plus the most recent differential. (Incremental backups would need every incremental since the full.)");
M("3.4","Which power solution provides immediate short-term battery power so that servers can shut down gracefully or until a generator starts?",[
["Uninterruptible power supply (UPS)"],
["Generator","A generator provides long-term power but takes time to start."],
["Power distribution unit","A PDU distributes power but does not supply it during an outage."],
["Dual power supplies","Dual PSUs provide redundancy within a server but need a power source."]],0,
"A UPS bridges the gap during outages; generators provide extended power once running.");
M("3.4","A company wants to recover from ransomware even if its primary backup server is encrypted. Which practice is MOST effective?",[
["Maintain offline or immutable offsite backup copies"],
["Store backups on a share mapped to every user's workstation","Ransomware can encrypt mapped shares."],
["Increase backup frequency onsite only","Onsite-only backups may be reached by the ransomware."],
["Use snapshots stored on the same volume","Snapshots on the same storage can be deleted or encrypted by attackers."]],0,
"Offline (air-gapped) or immutable backups cannot be modified or encrypted by ransomware, ensuring recoverability (e.g., the 3-2-1 rule).");
M("3.4","A team gathers in a conference room to talk through how they would respond to a regional power outage affecting the primary data center, without touching any systems. What type of exercise is this?",[
["Tabletop exercise"],
["Failover test","A failover test actually switches operations to backup systems."],
["Parallel processing test","Parallel testing runs backup systems alongside production."],
["Simulation","A simulation mimics a real event more realistically, often with hands-on activities."]],0,
"Tabletop exercises are discussion-based walkthroughs of plans; they are low-cost and low-risk.");
M("3.4","A web application uses several servers that share incoming traffic, so if one fails the others continue serving users. Which technique is this?",[
["Load balancing"],
["Journaling","Journaling records changes to enable recovery."],
["Snapshots","Snapshots capture a point-in-time state."],
["Cold site","A cold site is a recovery location."]],0,
"Load balancing distributes traffic among multiple servers, improving availability and scalability.");
M("3.4","A company uses the same firewall vendor and OS for all its systems. A single vulnerability could compromise everything. Which resilience concept addresses this?",[
["Platform diversity"],
["Capacity planning","Capacity planning ensures enough resources."],
["Geographic dispersion","Geographic dispersion addresses regional disasters."],
["Journaling","Journaling records changes."]],0,
"Platform (vendor/technology) diversity reduces the chance that a single flaw or failure affects all systems.");
M("3.4","A company stores backups in a data center 5 km away. A regional hurricane could damage both sites. What should the company implement?",[
["Geographic dispersion of recovery sites and backups"],
["Platform diversity","Diversity of vendors does not address regional disasters."],
["More frequent snapshots","Snapshots at the same locations would also be damaged."],
["Clustering","Clustering in the same region does not protect against regional disasters."]],0,
"Geographically dispersed sites ensure that a single regional event cannot take out both primary and backup locations.");
M("3.4","Which type of backup captures the state of a virtual machine at a specific point in time and allows quick rollback?",[
["Snapshot"],
["Differential","A differential captures changes since the last full backup."],
["Journaling","Journaling logs changes as they occur."],
["Replication","Replication copies data continuously to another location."]],0,
"Snapshots capture point-in-time images of VMs or storage, enabling fast rollback.");
M("3.4","A company spreads its workloads across AWS and Azure so that an outage at one provider does not take down all services. What is this called?",[
["Multi-cloud"],
["Hybrid cloud","Hybrid combines on-premises (private) with public cloud."],
["Community cloud","A community cloud is shared by organizations with common needs."],
["Air gap","An air gap is isolation."]],0,
"Multi-cloud uses more than one cloud provider, reducing provider lock-in and single-provider outage risk.");
M("3.4","During capacity planning for disaster recovery, a manager ensures enough cross-trained staff are available to operate the backup site. Which capacity planning element is this?",[
["People"],
["Technology","Technology refers to systems and software capacity."],
["Infrastructure","Infrastructure refers to facilities, power, and networks."],
["Journaling","Journaling is a backup technique."]],0,
"Capacity planning covers people, technology, and infrastructure; staffing is the people component.");
M("3.1","A company's microservices architecture is compromised in one service, but the attacker cannot easily reach other services. Which property of microservices helped limit the impact?",[
["Services are independently deployed and isolated, with their own scoped access"],
["All services share a single database admin account","Shared privileged credentials would increase impact."],
["Microservices remove the need for APIs","Microservices communicate via APIs."],
["Microservices run every component in a single shared process","That describes a monolithic application, where one compromise exposes everything."]],0,
"Isolation between microservices limits blast radius when combined with least-privilege service identities and API security.");

// Domain 4.0 Security Operations
M("4.1","A company wants every new Windows server to be deployed with the same hardened settings. What should the security team do FIRST?",[
["Establish a secure baseline configuration"],
["Deploy the servers and scan them afterward","Scanning without a defined baseline gives nothing to measure against."],
["Purchase cyber insurance","Insurance transfers risk; it doesn't define configurations."],
["Enable all available services for flexibility","Enabling unneeded services increases attack surface."]],0,
"Secure baselines are established first (often from CIS Benchmarks), then deployed and maintained over time.");
M("4.1","Before deploying wireless access points in a new office, an engineer walks the floor measuring signal strength and interference to determine AP placement. What is this called?",[
["Site survey"],
["Penetration test","A pen test attempts exploitation."],
["War driving","War driving is searching for wireless networks, typically by attackers."],
["Packet capture","A packet capture records network traffic."]],0,
"A site survey (often producing a heat map) determines optimal AP placement and coverage and identifies interference and rogue APs.");
M("4.1","An organization's enterprise Wi-Fi should use the strongest current security standard with individual user authentication against the corporate directory. Which configuration is BEST?",[
["WPA3-Enterprise with 802.1X/RADIUS"],
["WPA2-Personal with a strong pre-shared key","PSK uses a shared password, not individual user authentication."],
["WEP with a 128-bit key","WEP is broken."],
["Open network with a captive portal","Captive portals don't encrypt traffic over the air."]],0,
"WPA3-Enterprise uses 802.1X with a RADIUS server for per-user authentication and provides stronger encryption.");
M("4.1","Which WPA3 feature replaces the WPA2 pre-shared key handshake to protect against offline dictionary attacks?",[
["Simultaneous Authentication of Equals (SAE)"],
["TKIP","TKIP is a legacy WPA protocol."],
["WPS","WPS is a convenience feature with known weaknesses."],
["EAP-MD5","EAP-MD5 is a weak legacy EAP method."]],0,
"SAE (Dragonfly key exchange) in WPA3-Personal resists offline dictionary attacks and provides forward secrecy.");
M("4.1","A company lets employees choose a device from an approved list; the company buys and owns it. Which mobile deployment model is this?",[
["CYOD (Choose Your Own Device)"],
["BYOD","In BYOD, employees use their personally owned devices."],
["COPE","In COPE, the company provides a device it selects; with CYOD the employee chooses from a list."],
["VDI","VDI is virtual desktop infrastructure, not a device ownership model."]],0,
"CYOD: employee chooses from a company-approved list; the company owns the device.");
M("4.1","Which tool allows an organization to enforce passcodes, push apps, and remotely wipe lost corporate smartphones?",[
["Mobile device management (MDM)"],
["SIEM","A SIEM aggregates and correlates logs."],
["NetFlow","NetFlow records network traffic metadata."],
["WAF","A WAF protects web applications."]],0,
"MDM centrally manages mobile devices: policy enforcement, app deployment, encryption, remote lock/wipe.");
M("4.1","A developer wants to find vulnerabilities in source code before compiling and without running the application. What technique should be used?",[
["Static code analysis (SAST)"],
["Dynamic analysis (DAST)","Dynamic analysis tests a running application."],
["Fuzzing","Fuzzing sends random data to a running program."],
["Penetration testing","Pen testing tests a running system."]],0,
"Static analysis examines source code without executing it to find issues like injection flaws and hard-coded secrets.");
M("4.1","Users must be able to verify that a downloaded application came from the company and has not been modified. What should the company implement?",[
["Code signing"],
["Input validation","Input validation protects against malicious input, not download integrity."],
["Sandboxing","Sandboxing isolates execution."],
["Obfuscation","Obfuscation makes code hard to read but doesn't prove origin."]],0,
"Code signing uses a digital signature to verify the publisher and integrity of software.");
M("4.1","A web application sets session cookies. Which cookie attributes help protect the session from theft via XSS and transmission over unencrypted connections? (Choose two.)",[
["HttpOnly"],
["Secure"],
["Expires set to 10 years","Very long expiration increases risk."],
["Domain set to a parent public suffix","Overly broad domains expose cookies more widely."],
["Path=/admin only","Path scoping doesn't prevent XSS theft or plaintext transmission."]],[0,1],
"HttpOnly prevents JavaScript access to the cookie; Secure ensures it's only sent over HTTPS. SameSite helps against CSRF.");
M("4.1","A security analyst wants to safely execute a suspicious email attachment to observe its behavior without risking the production network. What should be used?",[
["Sandbox"],
["Jump server","A jump server provides admin access to secure zones."],
["Production file server","Executing malware there would risk infection."],
["Honeyfile","A honeyfile is a decoy file to detect access."]],0,
"A sandbox is an isolated environment in which untrusted code can run and be observed.");
M("4.1","A web form accepts a 'quantity' field. Which control BEST prevents malicious input from being processed?",[
["Server-side input validation that allows only integers within an expected range"],
["Client-side JavaScript validation only","Client-side checks can be bypassed easily."],
["Encrypting the field with TLS","TLS protects transit but not against malicious content."],
["Logging the input","Logging doesn't prevent processing."]],0,
"Server-side input validation using allow lists (expected type, length, and range) is the primary defense against injection and malformed input.");
M("4.2","When an employee leaves, IT recovers the laptop but doesn't know which other company assets she had. Which process would have prevented this problem?",[
["Asset assignment and accounting (ownership tracking in an inventory)"],
["Data retention","Data retention defines how long to keep data."],
["Penetration testing","Pen testing finds vulnerabilities."],
["Sanitization","Sanitization removes data from media."]],0,
"Asset management assigns ownership and tracks assets throughout their lifecycle, enabling recovery during offboarding.");
M("4.2","A company is retiring hard drives containing confidential data and wants them reused by a charity. Which method is MOST appropriate?",[
["Sanitize the drives using an approved overwrite/secure erase method and document it"],
["Physically shred the drives","Shredding destroys them, so they can't be reused."],
["Delete the files and empty the recycle bin","Deleted files can be recovered."],
["Perform a quick format","A quick format leaves data recoverable."]],0,
"Sanitization (e.g., overwriting, cryptographic erase, ATA Secure Erase) removes data so media can be reused. Destruction is used when media won't be reused.");
M("4.2","An organization hires a vendor to destroy old drives. Which document provides proof that the destruction occurred?",[
["Certificate of destruction"],
["Service level agreement","An SLA defines service levels."],
["Memorandum of understanding","An MOU describes intent between parties."],
["Acceptable use policy","An AUP describes acceptable user behavior."]],0,
"A certificate of destruction from the vendor documents that the media was destroyed, supporting compliance and audits.");
M("4.2","Which activity discovers all devices currently connected to the network, including those not in the asset inventory?",[
["Enumeration/network discovery scanning"],
["Data retention review","Retention concerns how long data is kept."],
["Procurement","Procurement is the purchasing process."],
["Configuration baseline review","A baseline review checks settings of known systems; it does not find unknown devices."]],0,
"Enumeration and discovery scans identify all active devices, revealing unmanaged or rogue assets.");
M("4.3","A vulnerability scan reports a critical Apache vulnerability on a server, but the server runs IIS and has no Apache installed. What is this finding?",[
["False positive"],
["False negative","A false negative is a real vulnerability the scanner missed."],
["True positive","A true positive is a real vulnerability correctly identified."],
["True negative","A true negative is correctly reporting no vulnerability."]],0,
"A false positive is a reported vulnerability that doesn't actually exist. Findings should be validated before remediation.");
M("4.3","Which of the following is MOST concerning in vulnerability management?",[
["False negatives, because real vulnerabilities go unreported"],
["False positives, because they waste analyst time","False positives waste time but don't leave real flaws hidden."],
["True positives, because they require patching","True positives are expected and actionable."],
["True negatives","True negatives correctly indicate no issue."]],0,
"False negatives are the most dangerous since they create a false sense of security.");
M("4.3","A vulnerability scanner reports the same finding on two servers with identical CVSS base scores of 9.8. One is internet-facing; the other is on an isolated lab network. Which should be remediated FIRST and why?",[
["The internet-facing server, because environmental factors such as exposure increase risk"],
["The lab server, because it is easier to patch","Ease of patching shouldn't override risk."],
["Neither, because the CVSS score is the same","Equal base scores don't mean equal risk."],
["Both must wait for the next quarterly cycle","Critical, exposed vulnerabilities should be prioritized promptly."]],0,
"CVSS base scores measure severity, but prioritization should account for environmental variables such as exposure, asset criticality, and compensating controls.");
M("4.3","A security team needs to identify vulnerabilities in a running web application by sending crafted requests and observing responses. Which technique is this?",[
["Dynamic application security testing (DAST)"],
["Static code analysis","Static analysis reviews code without running it."],
["Package monitoring","Package monitoring tracks third-party library vulnerabilities."],
["Code signing","Code signing verifies integrity."]],0,
"DAST tests a running application from the outside, simulating attacks.");
M("4.3","A company invites independent researchers to report vulnerabilities in its website in exchange for monetary rewards. What is this program called?",[
["Bug bounty"],
["Red team exercise","Red teams are engaged attackers, usually internal or contracted, not open public programs."],
["Tabletop exercise","Tabletop exercises are discussion-based."],
["Vulnerability scan","A scan is automated, not researcher-driven."]],0,
"A bug bounty is a responsible disclosure program that pays researchers for valid vulnerability reports.");
M("4.3","A development team wants to be alerted when a third-party open-source library used in its application has a newly published CVE. Which technique should it use?",[
["Package monitoring (software composition analysis)"],
["Static code analysis of only in-house code","This would miss third-party library CVEs."],
["Penetration testing once a year","Annual testing is too infrequent for new CVEs."],
["Code signing","Code signing doesn't detect library vulnerabilities."]],0,
"Package monitoring/SCA tracks dependencies and alerts on known vulnerabilities in them.");
M("4.3","A critical vulnerability exists on a medical device whose manufacturer prohibits patching. The device is placed on an isolated VLAN with strict ACLs. Which remediation approach was used?",[
["Compensating controls through segmentation"],
["Patching","The device couldn't be patched."],
["Cyber insurance","Insurance transfers financial impact; it doesn't reduce technical exposure."],
["Risk avoidance by decommissioning","The device is still in use."]],0,
"When patching isn't possible, segmentation and other compensating controls reduce exposure. A documented exception is often also required.");
M("4.3","After applying a patch for a critical vulnerability, what should the security team do NEXT?",[
["Rescan to validate that the vulnerability has been remediated"],
["Close the ticket immediately","Closure should follow validation."],
["Remove the system from the asset inventory","The system is still in use."],
["Disable the vulnerability scanner","Scanning is needed for validation."]],0,
"Validation of remediation (rescanning, audit, verification) confirms the fix worked.");
M("4.3","Which threat intelligence source is gathered from publicly available information such as news, social media, and public vulnerability databases?",[
["OSINT"],
["Proprietary threat feed","Proprietary feeds are commercial and paid."],
["Dark web monitoring","The dark web is not publicly indexed or easily accessible."],
["Classified government sources","Classified sources are not public."]],0,
"Open-source intelligence (OSINT) is derived from publicly available sources.");
M("4.3","What does the Common Vulnerabilities and Exposures (CVE) system provide?",[
["A unique identifier for each publicly known vulnerability"],
["A severity score from 0 to 10","That is CVSS."],
["A patch for each vulnerability","CVE doesn't provide patches."],
["A list of malicious IP addresses","That's threat intelligence."]],0,
"CVE assigns standardized identifiers (e.g., CVE-2024-12345) to known vulnerabilities; CVSS scores their severity.");
M("4.4","A security team wants to collect logs from firewalls, servers, and endpoints into one platform that correlates events and generates alerts. Which tool is MOST appropriate?",[
["SIEM"],
["DLP","DLP prevents data exfiltration."],
["NAC","NAC controls network admission."],
["MDM","MDM manages mobile devices."]],0,
"A SIEM aggregates logs, normalizes and correlates them, and alerts on suspicious patterns.");
M("4.4","The SOC receives hundreds of alerts daily from a SIEM rule that fires on benign administrative scripts. What should analysts do to reduce analyst fatigue without missing real threats?",[
["Tune the alert rule with exclusions for the known benign activity"],
["Disable the SIEM","This would eliminate visibility."],
["Ignore all alerts from that rule","Ignoring could miss true positives."],
["Increase the number of alerts","More noise worsens fatigue."]],0,
"Alert tuning reduces false positives by refining rules so that real threats stand out.");
M("4.4","Which protocol allows network devices to send unsolicited alerts to a management station when a threshold is exceeded?",[
["SNMP traps"],
["NetFlow","NetFlow exports traffic flow records."],
["Syslog over TLS only","Syslog sends log messages; 'traps' is the SNMP mechanism."],
["SCAP","SCAP is a set of standards for automating vulnerability and compliance checks."]],0,
"SNMP traps are unsolicited messages from agents to the manager. SNMPv3 should be used for authentication and encryption.");
M("4.4","An analyst needs to see which internal hosts communicated with an external IP, how much data was transferred, and when—without full packet contents. Which data source is BEST?",[
["NetFlow"],
["Full packet capture","Packet capture includes payloads; NetFlow provides the needed metadata more efficiently."],
["Endpoint antivirus logs","AV logs show malware detections, not flows."],
["SNMP traps","Traps are alerts, not flow records."]],0,
"NetFlow/IPFIX records metadata about flows: source/destination IP, ports, protocol, bytes, and timestamps.");
M("4.4","Which framework provides standardized formats for automated vulnerability management and configuration compliance checking?",[
["SCAP"],
["SNMP","SNMP is for network device management."],
["SAML","SAML is for federated authentication."],
["STIX","STIX is a format for sharing threat intelligence, not configuration checking."]],0,
"The Security Content Automation Protocol (SCAP) includes standards such as CVE, CVSS, CPE, and XCCDF/OVAL for automated compliance checks.");
M("4.4","Logs must be retained for seven years for compliance but rarely accessed. What activity addresses this?",[
["Archiving"],
["Alert tuning","Tuning adjusts alert rules."],
["Quarantine","Quarantine isolates suspicious files or systems."],
["Scanning","Scanning identifies vulnerabilities."]],0,
"Archiving moves logs to long-term, lower-cost storage while retaining them per policy.");
M("4.4","A security team wants to monitor for sensitive data such as credit card numbers leaving the network via email and web uploads. Which tool should it use?",[
["Data loss prevention (DLP)"],
["SNMP","SNMP monitors device status."],
["Vulnerability scanner","Scanners find vulnerabilities."],
["Load balancer","Load balancers distribute traffic."]],0,
"DLP inspects content in motion, at rest, and in use, blocking or alerting on sensitive data leaving the organization.");
M("4.5","A company wants to block employees from visiting gambling and malware sites from the office and from laptops when they work at home. Which solution BEST meets this need?",[
["Agent-based web filtering"],
["Centralized on-premises proxy only","An on-prem proxy won't filter home traffic unless all traffic is tunneled back."],
["Port security","Port security restricts switch ports."],
["File integrity monitoring","FIM detects file changes."]],0,
"Agent-based web filters run on endpoints and enforce policy regardless of location.");
M("4.5","Which email security mechanism lets a domain owner publish a DNS record listing the IP addresses authorized to send mail for the domain?",[
["SPF"],
["DKIM","DKIM signs messages with a private key; receivers verify with a public key in DNS."],
["DMARC","DMARC specifies policy for handling messages that fail SPF/DKIM and provides reporting."],
["S/MIME","S/MIME is end-to-end message encryption and signing."]],0,
"Sender Policy Framework (SPF) is a DNS TXT record listing authorized sending servers.");
M("4.5","A domain owner wants receiving mail servers to reject messages that fail SPF and DKIM alignment, and to receive reports about such messages. What should be configured?",[
["DMARC with a policy of p=reject"],
["SPF with ~all","SPF alone doesn't define alignment-based handling or reporting."],
["DKIM selector rotation","Rotation manages keys but doesn't set policy."],
["An MX record","MX records specify inbound mail servers."]],0,
"DMARC tells receivers what to do (none, quarantine, reject) when messages fail SPF/DKIM alignment and enables aggregate/forensic reporting.");
M("4.5","Which mechanism adds a digital signature to outgoing email headers so recipients can verify the message was not altered and came from the domain?",[
["DKIM"],
["SPF","SPF validates the sending server's IP, not a message signature."],
["DMARC","DMARC builds on SPF/DKIM but doesn't sign messages itself."],
["DNSSEC","DNSSEC signs DNS records, not emails."]],0,
"DomainKeys Identified Mail signs messages; the public key is published in DNS.");
M("4.5","A security team wants to detect unauthorized modifications to critical system files such as /etc/passwd and Windows system DLLs. Which tool should it deploy?",[
["File integrity monitoring (FIM)"],
["DLP","DLP monitors sensitive data leaving the organization."],
["Web filter","Web filters control browsing."],
["NetFlow","NetFlow records traffic metadata."]],0,
"FIM compares file hashes against a baseline and alerts on changes.");
M("4.5","Before allowing a laptop on the corporate network, a system checks that the device has current patches and an active EDR agent; noncompliant devices are placed in a remediation VLAN. What is this?",[
["Network access control (NAC)"],
["DLP","DLP controls data, not network admission."],
["UBA","UBA analyzes user behavior."],
["SPF","SPF is email authentication."]],0,
"NAC evaluates device posture before granting access, quarantining or remediating noncompliant devices.");
M("4.5","Which security tool collects telemetry from endpoints, network, cloud, and email to correlate and respond to threats across multiple layers?",[
["XDR"],
["Traditional antivirus","Antivirus focuses on file-based malware detection on a single endpoint."],
["Packet filter firewall","Packet filters only check headers."],
["SNMP","SNMP is device management."]],0,
"Extended detection and response (XDR) correlates data across multiple security layers; EDR focuses on endpoints.");
M("4.5","An analyst is alerted that a finance user who normally downloads 20 files a day downloaded 4,000 files at 2 a.m. Which technology MOST likely generated this alert?",[
["User behavior analytics (UBA)"],
["SPF","SPF is email authentication."],
["Port security","Port security restricts MAC addresses."],
["Signature-based IDS","Signature-based detection matches known patterns, not deviations from a user's baseline."]],0,
"UBA/UEBA establishes baselines of normal behavior and alerts on anomalies.");
M("4.5","A Linux administrator wants to enforce mandatory access control policies that confine services even if they run as root. Which feature should be enabled?",[
["SELinux"],
["Group Policy","Group Policy is for Windows environments."],
["sudo","sudo grants privileged execution; it doesn't confine processes."],
["chmod 777","This grants everyone full permissions."]],0,
"SELinux implements MAC on Linux, confining processes according to policy regardless of user privilege.");
M("4.5","A company wants to block access to known malicious domains for all devices, including IoT devices that cannot run agents. Which control is MOST effective?",[
["DNS filtering"],
["Agent-based web filter","IoT devices can't run agents."],
["File integrity monitoring","FIM detects file changes on hosts."],
["Code signing","Code signing verifies software."]],0,
"DNS filtering blocks resolution of malicious domains at the network level for any device using the organization's DNS.");
M("4.5","An IDS uses known attack patterns to identify threats but misses a new attack. Which detection method would MOST likely catch the new attack?",[
["Anomaly/behavior-based detection"],
["Signature-based detection","Signature-based detection requires a known pattern."],
["Allow listing","Allow lists control execution, not detection."],
["Port mirroring","Mirroring copies traffic."]],0,
"Anomaly-based detection compares activity to a baseline and can detect novel attacks, though it produces more false positives.");
M("4.6","A new employee's accounts are automatically created with permissions based on her job role in the HR system. Which process does this describe?",[
["Provisioning"],
["De-provisioning","De-provisioning removes access."],
["Attestation","Attestation is periodic certification that access is still appropriate."],
["Federation","Federation trusts identities across organizations."]],0,
"Provisioning creates accounts and grants appropriate access, ideally automated from authoritative HR data.");
M("4.6","Which access control model assigns permissions to job functions, and users receive permissions by being assigned to those functions?",[
["Role-based access control (RBAC)"],
["Discretionary access control (DAC)","In DAC the resource owner grants access."],
["Mandatory access control (MAC)","MAC uses labels and clearances."],
["Rule-based access control","Rule-based uses global rules such as ACLs or time restrictions."]],0,
"RBAC simplifies administration by assigning permissions to roles, then users to roles.");
M("4.6","A government system grants access only if a user's clearance level equals or exceeds the classification label of the document. Which access control model is this?",[
["Mandatory access control (MAC)"],
["DAC","DAC lets owners decide access."],
["RBAC","RBAC uses roles, not labels and clearances."],
["ABAC","ABAC evaluates many attributes; the label-and-clearance model is MAC."]],0,
"MAC uses security labels and clearances enforced by the system; users cannot change permissions.");
M("4.6","A policy allows access to patient records only if the user is a doctor, is assigned to the patient, and is accessing from a hospital device during their shift. Which access control model is this?",[
["Attribute-based access control (ABAC)"],
["RBAC","RBAC uses only role membership; this policy combines many attributes."],
["DAC","DAC is owner-controlled."],
["MAC","MAC uses labels and clearances."]],0,
"ABAC evaluates attributes of the subject, object, action, and environment.");
M("4.6","A file owner on a Windows workstation grants a coworker read access to a folder she created. Which access control model is this?",[
["Discretionary access control (DAC)"],
["MAC","In MAC, owners cannot change access."],
["Rule-based","Rule-based uses system-wide rules."],
["ABAC","ABAC uses policy-evaluated attributes."]],0,
"In DAC, the owner of a resource decides who can access it.");
M("4.6","A user logs in once to the corporate identity provider and can access Salesforce, Workday, and other SaaS apps without re-entering credentials. The IdP sends XML assertions to the apps. Which technology is in use?",[
["SAML-based single sign-on"],
["OAuth only","OAuth is an authorization framework that issues tokens; XML assertions indicate SAML."],
["LDAP","LDAP is a directory access protocol."],
["RADIUS","RADIUS is used for network access AAA."]],0,
"SAML uses XML assertions passed from the identity provider to service providers for web SSO.");
M("4.6","A mobile app lets users grant it permission to read their Google calendar without giving the app their Google password. Which framework is being used?",[
["OAuth 2.0"],
["SAML","SAML is mainly for enterprise web SSO with XML assertions."],
["Kerberos","Kerberos is used within enterprise networks/domains."],
["TACACS+","TACACS+ is for device administration AAA."]],0,
"OAuth provides delegated authorization via access tokens without sharing credentials. OpenID Connect adds authentication on top of OAuth.");
M("4.6","Which of the following are examples of 'something you have' authentication factors? (Choose two.)",[
["A hardware security key (FIDO2)"],
["A smart card"],
["A fingerprint","A fingerprint is something you are."],
["A PIN","A PIN is something you know."],
["GPS location","Location is somewhere you are."]],[0,1],
"Possession factors include smart cards, hardware tokens, security keys, and authenticator apps on a phone.");
M("4.6","Which authentication approach is MOST resistant to phishing?",[
["FIDO2/WebAuthn security keys or passkeys"],
["SMS one-time codes","SMS codes can be phished or intercepted via SIM swapping."],
["Security questions","Answers are often guessable or researchable."],
["Email one-time links","Email accounts can be compromised and links phished."]],0,
"FIDO2/WebAuthn cryptographically binds authentication to the legitimate site's origin, so credentials cannot be replayed on a phishing site.");
M("4.6","A company wants administrators to receive domain admin privileges only when needed for a specific task and have them automatically removed after two hours. What is this?",[
["Just-in-time (JIT) permissions via privileged access management"],
["Permanent admin accounts","These are standing privileges, the opposite of JIT."],
["Shared admin passwords","Shared passwords reduce accountability."],
["Password expiration","Expiration doesn't grant temporary privileges."]],0,
"JIT access through PAM minimizes standing privileges, reducing the window for abuse.");
M("4.6","Which password practice aligns BEST with current guidance such as NIST SP 800-63B?",[
["Favor long passphrases, check new passwords against breached-password lists, and avoid forced periodic changes unless compromise is suspected"],
["Require password changes every 30 days","Frequent forced changes lead to weak, predictable patterns."],
["Limit passwords to 8 characters","Longer passwords should be allowed and encouraged."],
["Prohibit password managers","Password managers help users create and store unique, strong passwords."]],0,
"Length matters most; screen passwords against known-compromised lists; don't force arbitrary rotation.");
M("4.6","A manager is asked each quarter to review and confirm that the users in her department still need their current access rights. What is this process called?",[
["Access attestation (recertification)"],
["Provisioning","Provisioning creates access."],
["Federation","Federation is cross-organization identity trust."],
["Identity proofing","Identity proofing verifies who someone is at enrollment."]],0,
"Periodic access reviews/attestation help detect privilege creep and inappropriate access.");
M("4.6","A company allows users to log in to Windows with a fingerprint reader and a PIN tied to the TPM, with no password. Which concept does this BEST describe?",[
["Passwordless authentication"],
["Federation","Federation trusts identities across domains."],
["Single-factor password authentication","No password is used, and multiple factors are present."],
["Password vaulting","Vaulting stores privileged credentials."]],0,
"Passwordless authentication (e.g., Windows Hello for Business, passkeys) replaces passwords with device-bound credentials and biometrics or PINs.");
M("4.6","Which process verifies a new user's real-world identity (e.g., checking a government ID) before issuing credentials?",[
["Identity proofing"],
["Attestation","Attestation confirms existing access is appropriate."],
["Authorization","Authorization determines what a user can access."],
["Accounting","Accounting tracks activity."]],0,
"Identity proofing establishes that a person is who they claim to be before an identity is created.");
M("4.7","A security team writes a script that automatically disables a user account and opens a ticket when the SIEM detects impossible travel. Which TWO benefits does this automation provide? (Choose two.)",[
["Faster reaction time"],
["Workforce multiplier"],
["Elimination of all false positives","Automation acts on alerts; it doesn't eliminate false positives."],
["No ongoing maintenance needed","Automation requires ongoing supportability."],
["Removal of single points of failure","Automation can itself become a single point of failure."]],[0,1],
"Automation speeds response and lets a small team accomplish more. Risks include complexity, cost, technical debt, and single points of failure.");
M("4.7","Which of the following is a potential DRAWBACK of extensive security automation and orchestration?",[
["It can introduce complexity and technical debt, and a failed automation can become a single point of failure"],
["It always reduces costs to zero","Automation has development and maintenance costs."],
["It slows down incident response","Automation generally speeds response."],
["It makes baselines impossible to enforce","Automation helps enforce baselines."]],0,
"Considerations include complexity, cost, single point of failure, technical debt, and ongoing supportability.");
M("4.7","A cloud team configures policies that automatically prevent anyone from creating a storage bucket with public access. What is this an example of?",[
["Guard rails"],
["Escalation","Escalation routes issues to higher tiers."],
["Ticket creation","Ticketing tracks work."],
["Continuous integration","CI builds and tests code."]],0,
"Guard rails are automated controls that prevent insecure configurations while allowing teams to work quickly.");
M("4.8","Which incident response phase includes creating the IR plan, assembling the team, and acquiring tools?",[
["Preparation"],
["Detection","Detection identifies incidents."],
["Containment","Containment limits damage."],
["Lessons learned","Lessons learned happens after recovery."]],0,
"Preparation readies the organization to respond: plans, policies, team, tools, communications, and training.");
M("4.8","A SOC analyst confirms that a workstation is infected and spreading malware. What should be done FIRST?",[
["Isolate the workstation from the network (containment)"],
["Reimage the workstation","Eradication should follow containment, and evidence may be lost."],
["Hold a lessons learned meeting","Lessons learned happens after recovery."],
["Restore files from backup","Recovery follows containment and eradication."]],0,
"Containment limits spread and damage. CompTIA's process: preparation, detection, analysis, containment, eradication, recovery, lessons learned.");
M("4.8","After malware has been removed and systems restored, the IR team meets to discuss what happened and how to improve. Which phase is this?",[
["Lessons learned"],
["Eradication","Eradication removes the threat."],
["Recovery","Recovery restores systems to operation."],
["Preparation","Preparation occurs before incidents."]],0,
"Lessons learned (post-incident activity) identifies improvements to prevent recurrence and improve response.");
M("4.8","Legal counsel informs IT that the company is being sued and that all email related to a project must be preserved and not deleted. What has been issued?",[
["Legal hold"],
["Chain of custody","Chain of custody documents evidence handling."],
["Data retention policy","Retention policies set normal timelines; a legal hold overrides them."],
["E-discovery request","E-discovery is the process of collecting and producing ESI; the preservation notice is a legal hold."]],0,
"A legal hold requires preservation of relevant data, suspending normal deletion schedules.");
M("4.8","A forensic investigator records every person who handled a seized hard drive, when, and why. What is this documentation called?",[
["Chain of custody"],
["Legal hold","A legal hold preserves data."],
["Order of volatility","Order of volatility guides collection order."],
["Root cause analysis","RCA identifies why an incident happened."]],0,
"Chain of custody proves evidence integrity and admissibility by documenting every transfer.");
M("4.8","When collecting digital evidence from a running system, which should be collected FIRST?",[
["Contents of RAM"],
["Hard disk image","Disk is less volatile than memory."],
["Backup tapes","Archival media is the least volatile."],
["Remote syslog data","Remote logs are less volatile than RAM."]],0,
"Following the order of volatility, collect the most volatile data first: CPU registers/cache, then RAM, then temporary files, disk, remote logs, and archives.");
M("4.8","A forensic analyst creates a bit-by-bit copy of a drive and calculates hashes of both the original and the copy. Why are the hashes calculated?",[
["To prove the copy is identical and the evidence has not been altered"],
["To encrypt the evidence","Hashing does not encrypt."],
["To compress the image","Hashing does not compress."],
["To identify the malware family","Hashes of a whole disk don't identify malware."]],0,
"Matching hashes demonstrate integrity of the acquired image; analysis is performed on the copy.");
M("4.8","Analysts proactively search through EDR and SIEM data for signs of an adversary that hasn't triggered any alerts, based on a hypothesis from threat intelligence. What is this activity?",[
["Threat hunting"],
["Vulnerability scanning","Scanning finds vulnerabilities, not active adversaries."],
["Tabletop exercise","Tabletops are discussion exercises."],
["Penetration testing","Pen testing simulates attacks."]],0,
"Threat hunting assumes compromise and proactively looks for hidden threats.");
M("4.8","After an outage caused by a breach, an analyst determines that the initial entry was an unpatched VPN appliance and that the patch process lacked ownership. What has the analyst performed?",[
["Root cause analysis"],
["Legal hold","Legal hold preserves data."],
["E-discovery","E-discovery produces data for litigation."],
["Threat feed analysis","Threat feeds provide external intelligence."]],0,
"RCA identifies the underlying cause so it can be corrected.");
M("4.9","Which log source would BEST show that a user executed PowerShell with an encoded command on a workstation?",[
["Endpoint / OS security logs (e.g., process creation and PowerShell logs)"],
["Firewall logs","Firewall logs show network connections, not commands."],
["NetFlow","NetFlow shows flows."],
["Vulnerability scan results","Scans show vulnerabilities, not executed commands."]],0,
"Endpoint logs (Windows Event Logs, Sysmon, EDR telemetry, PowerShell script block logging) record process execution and commands.");
M("4.9","An analyst needs to examine the exact payload of a suspected exfiltration session to see what data was sent. Which data source is BEST?",[
["Packet capture"],
["NetFlow","NetFlow lacks payload content."],
["Dashboard","Dashboards summarize data."],
["Vulnerability scan","Scans report vulnerabilities."]],0,
"Packet captures (PCAPs) contain full packet contents for detailed analysis (if traffic isn't encrypted or can be decrypted).");
M("4.9","An investigator examines a photo posted by a suspect and finds GPS coordinates, the camera model, and a timestamp. What data source is this?",[
["Metadata"],
["Packet capture","PCAPs contain network traffic."],
["Firewall log","Firewall logs record traffic decisions."],
["IPS log","IPS logs record detected attacks."]],0,
"Metadata (e.g., EXIF in images, email headers, file properties) describes data and is valuable in investigations.");
M("4.9","A firewall log shows thousands of connection attempts from one external IP to sequential ports on a single internal host within one minute. What is MOST likely occurring?",[
["Port scan"],
["DDoS","A DDoS involves many sources; sequential ports from one source indicate a scan."],
["Password spraying","Spraying targets authentication, not sequential ports."],
["Data exfiltration","Exfiltration involves outbound data transfer."]],0,
"Sequential connection attempts to many ports from a single source are a classic port scan (reconnaissance).");
M("4.9","Which data source gives management a real-time, high-level visual view of security metrics such as open incidents and patch compliance?",[
["Dashboard"],
["Packet capture","PCAPs are low-level traffic data."],
["Metadata","Metadata describes files."],
["Raw syslog","Raw logs are not high-level summaries."]],0,
"Dashboards present summarized, visual information for quick situational awareness.");

// Domain 5.0 Security Program Management and Oversight
M("5.1","Which document defines what employees may and may not do with company computers, email, and internet access?",[
["Acceptable use policy (AUP)"],
["Business continuity plan","A BCP addresses keeping operations running during disruptions."],
["Service level agreement","An SLA defines service expectations with a provider."],
["Incident response plan","An IRP defines how to respond to incidents."]],0,
"An AUP defines acceptable and unacceptable use of organizational resources; users typically acknowledge it.");
M("5.1","A company document specifies that all passwords must be at least 14 characters and that AES-256 must be used for data at rest. What type of document is this?",[
["Standard"],
["Policy","Policies are high-level statements of intent; specific mandatory requirements are standards."],
["Guideline","Guidelines are recommendations, not mandatory."],
["Procedure","Procedures are step-by-step instructions."]],0,
"Standards define specific mandatory requirements that support policies.");
M("5.1","Which governance document provides step-by-step instructions for performing a task, such as onboarding a new employee?",[
["Procedure"],
["Policy","Policies state high-level intent."],
["Guideline","Guidelines are optional recommendations."],
["Standard","Standards specify mandatory requirements but not step-by-step instructions."]],0,
"Procedures describe exactly how to carry out a process.");
M("5.1","A SOC uses documented step-by-step response workflows for specific incident types such as phishing and ransomware. What are these called?",[
["Playbooks"],
["Guidelines","Guidelines are recommendations."],
["Policies","Policies are high-level."],
["SLAs","SLAs are service agreements."]],0,
"Playbooks (runbooks) provide predefined response steps for specific scenarios and are often automated in SOAR.");
M("5.1","Under data protection roles, who is ultimately accountable for a dataset, including deciding its classification and who may access it?",[
["Data owner"],
["Data custodian","The custodian implements and maintains controls (e.g., backups) as directed by the owner."],
["Data processor","A processor processes data on behalf of the controller."],
["End user","Users access data but aren't accountable for its classification."]],0,
"The data owner (usually a senior business manager) is accountable for the data, its classification, and access decisions.");
M("5.1","A database administrator performs daily backups, applies access permissions as instructed, and maintains the database servers. Which data role is this?",[
["Data custodian"],
["Data owner","The owner is accountable and makes decisions; the custodian implements them."],
["Data controller","The controller determines the purposes and means of processing personal data."],
["Data subject","The data subject is the individual the data is about."]],0,
"Custodians/stewards handle the day-to-day care of data according to the owner's requirements.");
M("5.1","A company hires a payroll provider that processes employee data only according to the company's instructions. Under GDPR terms, what is the payroll provider?",[
["Data processor"],
["Data controller","The company that determines the purpose of processing is the controller."],
["Data subject","Employees are the data subjects."],
["Data owner","Data owner is an internal accountability role."]],0,
"The processor processes personal data on behalf of the controller, which determines why and how the data is processed.");
M("5.1","Which type of governance structure places security decisions with a central team that sets policy for all business units?",[
["Centralized"],
["Decentralized","Decentralized governance distributes decision-making to business units."],
["Federated identity","Federation is about identity trust."],
["Committee-free governance","Governance structures include boards and committees; this is not a recognized structure."]],0,
"Centralized governance offers consistency; decentralized governance offers local flexibility.");
M("5.2","A server is worth $50,000. A flood would destroy 40% of its value. Floods are expected once every 10 years. What is the annualized loss expectancy (ALE)?",[
["$2,000"],
["$20,000","$20,000 is the SLE (50,000 × 0.4); it must be multiplied by the ARO of 0.1."],
["$5,000","This is 10% of the asset value; it ignores the exposure factor."],
["$200,000","This incorrectly multiplies by 10 instead of 0.1."]],0,
"SLE = AV × EF = $50,000 × 0.4 = $20,000. ARO = 1/10 = 0.1. ALE = SLE × ARO = $2,000.");
M("5.2","A laptop costs $2,000 and is completely lost when stolen. The company expects 12 laptop thefts per year. What is the ALE?",[
["$24,000"],
["$2,000","That's the SLE."],
["$12,000","This uses the wrong values."],
["$166","This divides instead of multiplies."]],0,
"SLE = $2,000 × 1.0 = $2,000. ALE = $2,000 × 12 = $24,000.");
M("5.2","A risk assessment rates risks as High, Medium, or Low based on expert judgment rather than monetary values. What type of analysis is this?",[
["Qualitative"],
["Quantitative","Quantitative analysis uses numeric values such as SLE and ALE."],
["Business impact analysis","A BIA determines the impact of disruption to business functions."],
["Penetration test","Pen tests exploit vulnerabilities."]],0,
"Qualitative risk analysis uses subjective ratings (e.g., a heat map of likelihood × impact).");
M("5.2","A company buys cyber insurance to cover the costs of a potential data breach. Which risk management strategy is this?",[
["Transfer"],
["Accept","Accepting means taking no action beyond acknowledging the risk."],
["Avoid","Avoidance eliminates the activity causing the risk."],
["Mitigate","Mitigation reduces likelihood or impact through controls."]],0,
"Risk transfer shifts the financial impact to a third party such as an insurer.");
M("5.2","A company decides not to launch a product in a country because the legal risks are too high. Which strategy is this?",[
["Avoid"],
["Transfer","Transfer shifts impact to a third party."],
["Accept","Acceptance means proceeding despite the risk."],
["Mitigate","Mitigation means reducing risk while proceeding."]],0,
"Risk avoidance eliminates the risk by not engaging in the activity.");
M("5.2","The cost to fix a low-impact vulnerability exceeds the potential loss, so management documents and signs off on leaving it as-is. Which strategy is this?",[
["Accept"],
["Avoid","Avoidance would stop the activity entirely."],
["Transfer","Nothing was transferred to a third party."],
["Mitigate","No controls were added."]],0,
"Risk acceptance is appropriate when the cost of mitigation exceeds the expected loss; it should be formally documented (often as an exception).");
M("5.2","What is the maximum acceptable amount of data loss, measured in time, that a business can tolerate after an outage?",[
["Recovery point objective (RPO)"],
["Recovery time objective (RTO)","RTO is the maximum acceptable downtime."],
["Mean time between failures (MTBF)","MTBF measures reliability."],
["Mean time to repair (MTTR)","MTTR measures average repair time."]],0,
"RPO defines how much data (in time) can be lost, driving backup frequency. RTO defines how long systems can be down.");
M("5.2","A business impact analysis determines that the order-processing system must be back online within 4 hours of an outage. What does this 4-hour value represent?",[
["Recovery time objective (RTO)"],
["Recovery point objective (RPO)","RPO is about data loss, not downtime."],
["MTBF","MTBF measures the average time between failures."],
["ARO","ARO is how often a risk is expected to occur per year."]],0,
"RTO is the maximum tolerable time to restore a system after disruption.");
M("5.2","Which metric describes the average time a device operates before it fails and is used to estimate reliability?",[
["Mean time between failures (MTBF)"],
["MTTR","MTTR measures time to repair."],
["RPO","RPO concerns data loss."],
["SLE","SLE is the loss from a single event."]],0,
"A higher MTBF indicates greater reliability.");
M("5.2","Which document lists identified risks, their owners, likelihood, impact, and planned responses?",[
["Risk register"],
["Acceptable use policy","An AUP governs user behavior."],
["Statement of work","An SOW defines contracted work."],
["Chain of custody form","This documents evidence handling."]],0,
"A risk register tracks risks and associated information such as owners, ratings, KRIs, and treatments.");
M("5.2","A board states that it is willing to accept significant risk in order to pursue aggressive growth in new markets. Which risk appetite does this describe?",[
["Expansionary"],
["Conservative","A conservative appetite seeks to minimize risk."],
["Neutral","Neutral is a balanced appetite."],
["Risk avoidance","Avoidance is a response strategy, not an appetite."]],0,
"Risk appetite can be expansionary (willing to accept more risk for growth), neutral, or conservative.");
M("5.2","What is the difference between risk appetite and risk tolerance?",[
["Appetite is the overall amount of risk an organization is willing to pursue; tolerance is the acceptable variation around specific objectives"],
["They are the same thing","They are related but distinct."],
["Tolerance is the total risk the board wants to take on; appetite is the variation allowed for each project","This reverses the two definitions."],
["Appetite applies only to IT risk","Appetite applies across the organization."]],0,
"Risk appetite is broad; risk tolerance is the specific acceptable deviation, often expressed as thresholds.");
M("5.2","A security team tracks the number of unpatched critical vulnerabilities older than 30 days and alerts leadership when it exceeds 10. What is this metric?",[
["A key risk indicator (KRI)"],
["An RPO","RPO concerns data loss in recovery."],
["An SLE","SLE is a monetary loss estimate."],
["An MOU","An MOU is an agreement."]],0,
"KRIs are metrics that signal increasing risk exposure, often compared to thresholds.");
M("5.3","A company wants contractual permission to review a cloud vendor's security controls at any time. Which clause should be included in the contract?",[
["Right-to-audit clause"],
["Non-disclosure clause","An NDA protects confidential information."],
["Non-compete clause","A non-compete restricts competition."],
["Force majeure clause","Force majeure covers events beyond control."]],0,
"A right-to-audit clause allows the customer (or its auditors) to assess the vendor's controls.");
M("5.3","Which agreement defines measurable performance expectations such as 99.9% uptime and penalties if they are not met?",[
["Service level agreement (SLA)"],
["Memorandum of understanding (MOU)","An MOU is a non-binding statement of intent."],
["Non-disclosure agreement (NDA)","An NDA protects confidential information."],
["Business partners agreement (BPA)","A BPA defines a business partnership's terms."]],0,
"SLAs specify service metrics and remedies for failing to meet them.");
M("5.3","Two organizations want to document a non-binding mutual intent to cooperate on a project before formal contracts are drafted. Which document is MOST appropriate?",[
["Memorandum of understanding (MOU)"],
["SLA","An SLA defines measurable service levels."],
["MSA","An MSA is a binding master contract."],
["SOW","An SOW defines specific deliverables."]],0,
"An MOU expresses mutual intent and is generally not legally binding. An MOA is somewhat more formal, defining conditions of cooperation.");
M("5.3","A company has an overarching contract with a consulting firm that sets general terms, and issues separate documents for each specific project's deliverables and timeline. What are these documents?",[
["Master service agreement (MSA) and statements of work (SOW)"],
["NDA and AUP","These don't define projects."],
["SLA and BIA","A BIA is an internal analysis."],
["MOU and BPA","These don't describe this structure."]],0,
"The MSA defines general terms for the relationship; each SOW/work order defines specific work, deliverables, and timelines.");
M("5.3","Before selecting a new SaaS vendor, a company reviews the vendor's SOC 2 Type II report, financial stability, and security questionnaire responses. What process is this?",[
["Due diligence"],
["Penetration testing","No testing is being performed."],
["Risk transference","Due diligence evaluates the vendor; transfer is a strategy."],
["Lessons learned","Lessons learned follows incidents."]],0,
"Due diligence is the investigation of a vendor's security posture and suitability before entering an agreement.");
M("5.3","A security team hires a firm to perform a penetration test. Which document defines what systems may be tested, when, and which techniques are prohibited?",[
["Rules of engagement"],
["Acceptable use policy","An AUP applies to employees."],
["Service level agreement","An SLA defines service metrics."],
["Business continuity plan","A BCP addresses continuity of operations."]],0,
"Rules of engagement set scope, timing, permitted techniques, communication paths, and authorization for testing.");
M("5.3","A vendor selection team discovers that the procurement manager's spouse owns one of the bidding companies. What issue should be addressed?",[
["Conflict of interest"],
["Right-to-audit clause","A right-to-audit clause lets the customer assess a vendor; it does not address personal relationships affecting selection."],
["Non-disclosure agreement","An NDA protects confidential information; it does not resolve a biased selection process."],
["Supply chain analysis","This is a personal relationship issue, not supply chain analysis."]],0,
"Conflicts of interest undermine objective vendor selection and must be disclosed and managed.");
M("5.3","After signing a contract, a company periodically reviews its vendor's security posture, incident history, and SLA performance. What is this activity called?",[
["Vendor monitoring"],
["Due diligence","Due diligence occurs before selection."],
["Rules of engagement","Rules of engagement apply to testing."],
["Onboarding","Onboarding is for new employees."]],0,
"Ongoing vendor monitoring ensures third parties continue to meet security requirements.");
M("5.4","An organization fails to comply with PCI DSS. Which consequences could it face? (Choose two.)",[
["Fines"],
["Loss of the ability to process card payments"],
["Automatic exemption from future audits","Non-compliance leads to more scrutiny, not exemptions."],
["Reduced audit frequency","Non-compliance typically increases scrutiny and audit frequency."],
["Automatic transfer of liability to the card brands","Liability is not transferred to the brands; the merchant remains responsible."]],[0,1],
"Non-compliance consequences include fines, sanctions, reputational damage, loss of license, and contractual impacts.");
M("5.4","Under GDPR, a customer asks a company to erase all of her personal data. Which right is she exercising?",[
["Right to be forgotten (erasure)"],
["Right to audit","This is a contractual clause, not a data subject right."],
["Data sovereignty","Sovereignty refers to jurisdictional laws over data."],
["Legal hold","A legal hold preserves data."]],0,
"The right to erasure allows data subjects to request deletion of their personal data under certain conditions.");
M("5.4","Employees must sign that they have read and understood the security policy each year. What is this called?",[
["Attestation and acknowledgment"],
["Due diligence","Due diligence is investigation."],
["Data retention","Retention is about how long data is kept."],
["Non-repudiation","Non-repudiation is a cryptographic concept."]],0,
"Acknowledgment/attestation documents that individuals have received and agreed to comply with policies.");
M("5.4","What is the difference between due diligence and due care?",[
["Due diligence is investigating and understanding risks; due care is acting responsibly to address them"],
["They are identical","They are related but distinct."],
["Due care is only for vendors","Due care applies across the organization."],
["Due diligence is only performed after a breach","Due diligence is ongoing and pre-emptive."]],0,
"Due diligence: researching and understanding risks. Due care: taking reasonable steps to protect against them.");
M("5.4","A company maintains a list of all personal data it holds, where it is stored, and how long it will be kept. What is this?",[
["Data inventory and retention schedule"],
["Risk register","A risk register tracks risks."],
["Chain of custody","Chain of custody tracks evidence."],
["Asset tag list","Asset tags track hardware."]],0,
"Data inventories and retention schedules support privacy compliance and minimize data held longer than necessary.");
M("5.4","A company's compliance team uses a tool that continuously checks cloud configurations against CIS benchmarks and generates compliance reports automatically. Which compliance monitoring approach is this?",[
["Automation"],
["Manual attestation","Attestation is a person confirming compliance."],
["Due diligence of vendors","This is internal monitoring."],
["Annual self-assessment questionnaire completed manually","A manual, point-in-time questionnaire is not continuous automated monitoring."]],0,
"Automated compliance monitoring provides continuous visibility and reduces manual effort.");
M("5.5","A penetration tester is given full network diagrams, source code, and credentials before testing. What type of test is this?",[
["Known environment (white box)"],
["Unknown environment (black box)","Black box testers have no prior knowledge."],
["Partially known environment (gray box)","Gray box testers have limited information."],
["Passive reconnaissance","Reconnaissance is information gathering, not a test type based on knowledge."]],0,
"In a known environment test, the tester has full information, enabling thorough coverage.");
M("5.5","A penetration tester researches a target company using LinkedIn, its website, and public DNS records without sending any traffic to the target's systems. What is this?",[
["Passive reconnaissance"],
["Active reconnaissance","Active recon interacts directly with target systems (e.g., scanning)."],
["Exploitation","No exploitation is occurring."],
["Lateral movement","Lateral movement happens after initial compromise."]],0,
"Passive reconnaissance gathers information without directly interacting with the target, minimizing detection.");
M("5.5","A company's internal audit team reviews whether IT controls are operating as described and reports to the audit committee. What type of assessment is this?",[
["Internal audit"],
["External regulatory examination","An examination is performed by a regulator."],
["Independent third-party audit","Third-party audits are performed by outside firms."],
["Bug bounty","Bug bounties use external researchers."]],0,
"Internal audits are performed by the organization's own auditors, who typically report to the audit committee for independence.");
M("5.5","A bank's regulator sends examiners to evaluate the bank's compliance with security regulations. What type of assessment is this?",[
["External regulatory examination"],
["Self-assessment","Self-assessments are performed internally."],
["Internal audit","Internal audits use internal staff."],
["Tabletop exercise","A tabletop is a discussion exercise."]],0,
"Regulators perform examinations to verify compliance with laws and regulations.");
M("5.5","During a penetration test, red and blue teams work together in real time, sharing findings so defenders can improve detection immediately. What type of testing is this?",[
["Integrated (purple team) testing"],
["Offensive testing only","Offensive (red team) testing alone doesn't involve real-time collaboration."],
["Defensive testing only","Defensive testing alone lacks attack simulation."],
["Unknown environment testing","Knowledge level is separate from collaboration."]],0,
"Integrated testing combines offensive and defensive efforts to improve detection and response.");
M("5.5","A tester tries to enter a secure facility by posing as a delivery person and tailgating employees. What type of penetration test is this?",[
["Physical penetration test"],
["Network penetration test","No network testing is involved."],
["Code review","No code is being reviewed."],
["Passive reconnaissance","Entering the building is active."]],0,
"Physical penetration tests evaluate physical security controls such as locks, guards, and procedures.");
M("5.5","A service organization provides customers with an independent auditor's report that evaluates the operating effectiveness of its security controls over six months. What is this report?",[
["SOC 2 Type II"],
["SOC 2 Type I","Type I assesses design at a single point in time."],
["Bug bounty report","Bug bounties are researcher submissions."],
["Risk register","A risk register is internal."]],0,
"SOC 2 Type II reports on the operating effectiveness of controls over a period; it is a form of independent third-party attestation.");
M("5.6","An employee receives an email with urgent language, a mismatched sender domain, and a link to reset a password she didn't request. What should she do FIRST?",[
["Report the message using the organization's phishing reporting process"],
["Click the link to see if it's legitimate","This could compromise her account or device."],
["Forward it to all coworkers as a warning","This spreads the malicious link."],
["Reply to the sender asking if it's real","Replying confirms the address is active."]],0,
"Users should recognize phishing indicators and report suspicious messages so the security team can respond.");
M("5.6","A company sends simulated phishing emails to employees and provides immediate training to anyone who clicks. What is this?",[
["Phishing campaign (simulation)"],
["Vishing attack","Vishing uses voice calls."],
["Penetration test of the firewall","This tests users, not the firewall."],
["Tabletop exercise","Tabletops are discussion exercises."]],0,
"Phishing simulations measure susceptibility and provide targeted training.");
M("5.6","Which security awareness topic is MOST relevant for employees who work from home and coffee shops?",[
["Securing home Wi-Fi, using the VPN, and preventing shoulder surfing in public places"],
["Data center access badge procedures","Less relevant to remote work."],
["Proper disposal of printed documents in the office shredder","Useful in the office, but the remote-work risks here are networks and public spaces."],
["How to configure the corporate perimeter firewall","Users do not manage perimeter firewalls; this is not an awareness topic."]],0,
"Hybrid/remote work training covers secure networks, VPN use, physical privacy, and device protection.");
M("5.6","An employee notices a coworker repeatedly accessing files unrelated to his job and copying them to a USB drive. What is this an example of?",[
["Anomalous behavior that should be reported as a possible insider threat"],
["Normal behavior","Accessing unrelated files and copying them is risky."],
["A phishing attempt","No phishing is involved."],
["Shadow IT","The behavior is data misuse, not unapproved IT services."]],0,
"Recognizing and reporting risky or unexpected behavior helps detect insider threats.");
M("5.6","A user inadvertently emails a spreadsheet with customer data to an external personal account to work on at home. How should the awareness program classify this behavior?",[
["Unintentional risky behavior requiring training"],
["Malicious insider activity","There is no indication of malicious intent."],
["A watering hole attack","No compromised website is involved."],
["Acceptable behavior","This violates data handling policy."]],0,
"Anomalous behavior can be risky, unexpected, or unintentional. Unintentional mistakes are addressed with training and controls such as DLP.");
M("5.6","Which metric BEST demonstrates the effectiveness of a security awareness program over time?",[
["Declining phishing simulation click rates and increasing report rates"],
["The number of training slides","Slide count doesn't measure behavior."],
["The length of the AUP","Length doesn't measure effectiveness."],
["The percentage of employees who completed the training module","Completion shows participation, not behavior change."]],0,
"Effective programs change behavior: fewer clicks and more reports of suspicious messages.");
M("5.1","Which external consideration would MOST directly require a U.S. healthcare provider to protect patient records?",[
["HIPAA regulatory requirements"],
["PCI DSS","PCI DSS applies to payment card data."],
["The company's AUP","An AUP is internal."],
["ISO 9001","ISO 9001 is a quality management standard."]],0,
"HIPAA is the U.S. regulation governing the protection of health information.");
M("5.1","A security policy was written five years ago and hasn't been updated, though the company has moved to the cloud. Which governance activity is lacking?",[
["Monitoring and revision of policies"],
["Data custodianship","Custodians care for data."],
["Incident response","IR is not policy maintenance."],
["Penetration testing","Pen tests don't update policies."]],0,
"Policies must be regularly reviewed and revised to reflect changes in technology, threats, and regulations.");
M("5.2","Which type of risk assessment is performed continuously, using automated tools to update risk ratings as conditions change?",[
["Continuous"],
["One-time","One-time assessments are performed once, often for a specific project."],
["Ad hoc","Ad hoc assessments are performed as needed, not continuously."],
["Recurring","Recurring assessments occur at regular intervals, such as annually."]],0,
"Risk assessments can be ad hoc, recurring, one-time, or continuous.");
M("5.2","A risk analysis finds that a vulnerability exists, but there is no realistic threat that can exploit it in this environment. What is the resulting risk?",[
["Low, because risk requires both a threat and a vulnerability"],
["Critical, because any vulnerability is critical","Vulnerability severity alone doesn't determine risk."],
["Undefined, because risk can't be assessed","Risk can be assessed using likelihood and impact."],
["Transferred","Nothing has been transferred."]],0,
"Risk is a function of the likelihood of a threat exploiting a vulnerability and the resulting impact.");

// Additional coverage for thinner objectives
M("4.7","A company automates user onboarding so that accounts, group memberships, and a laptop request ticket are created from a single HR event. Which benefit is MOST directly achieved?",[
["Consistent enforcement of baselines and standard configurations for every new hire"],
["Elimination of the need for access reviews","Automated provisioning doesn't remove the need to periodically review access."],
["Removal of all technical debt","Automation scripts can themselves create technical debt."],
["Guaranteed prevention of insider threats","Provisioning automation does not prevent insider misuse."]],0,
"Automated provisioning applies the same approved permissions and settings every time, reducing errors and speeding up onboarding.");
M("4.7","A single orchestration server runs all of a SOC's automated response playbooks. When it fails, no automated containment occurs. Which automation consideration does this illustrate?",[
["Single point of failure"],
["Workforce multiplier","This is a benefit of automation, not the problem shown."],
["Guard rails","Guard rails prevent insecure configurations."],
["Employee retention","Retention is a benefit related to reducing tedious work."]],0,
"Centralizing critical automation on one component creates a single point of failure; redundancy and manual fallback procedures are needed.");
M("4.7","A development pipeline automatically runs unit tests, SAST, and dependency scans on every commit and blocks the merge if critical findings appear. What practice is this?",[
["Continuous integration and testing"],
["Ticket escalation","Escalation routes issues to higher support tiers."],
["Change advisory board review","CAB review is a manual approval process."],
["Penetration testing","Pen testing is a periodic, human-driven assessment."]],0,
"CI automatically builds and tests code changes, including security tests, so problems are caught early.");
M("4.7","A security engineer integrates the SIEM with the ticketing system and EDR through APIs so that high-severity alerts automatically open a ticket and isolate the host. Which TWO automation use cases are shown? (Choose two.)",[
["Ticket creation"],
["Integrations and APIs"],
["Resource provisioning","No resources are being provisioned."],
["Guard rails","Nothing restricts configuration choices here."],
["User provisioning","No user accounts are being created."]],[0,1],
"Automation commonly creates/escalates tickets and uses APIs to integrate tools for faster, consistent response.");
M("4.2","During procurement of new network switches, the security team requires that the vendor provide a software bill of materials and supported-lifetime commitment. Why is this important?",[
["It ensures assets meet security requirements before purchase, including patch support and component visibility"],
["It eliminates the need for asset inventory","Inventory is still required after purchase."],
["It replaces vulnerability scanning","Scanning is still necessary after deployment."],
["It allows the switches to skip change management","All deployments still follow change management."]],0,
"Security involvement during acquisition/procurement ensures new assets are supportable and meet requirements before they enter the environment.");
M("4.2","A company's data retention policy says financial records must be kept for seven years. A storage administrator wants to delete five-year-old records to free space. What should happen?",[
["Keep the records until the retention period expires, then dispose of them securely"],
["Delete them immediately to reduce storage costs","This violates the retention requirement."],
["Move them to an employee's personal cloud storage","This creates a data exposure risk and violates policy."],
["Encrypt them and delete the key","Crypto-shredding before the retention period ends is still destruction."]],0,
"Retention requirements define how long data must be kept; disposal should only occur after the period ends, using approved methods.");
M("4.2","Which disposal method is MOST appropriate for SSDs that contained top-secret data and will NOT be reused?",[
["Physical destruction such as shredding or disintegration"],
["A single-pass overwrite","Wear leveling on SSDs means overwriting may not reach all blocks."],
["Quick format","Formatting leaves data recoverable."],
["Degaussing","Degaussing affects magnetic media and is ineffective on SSD flash memory."]],0,
"For the most sensitive data on media that won't be reused, physical destruction is the most certain method. Degaussing doesn't work on SSDs.");
M("4.9","An analyst investigating a phishing incident wants to determine the true sending server and path of a suspicious email. Which data source is MOST useful?",[
["Email header metadata"],
["Firewall logs","Firewall logs won't show the email's relay path."],
["Vulnerability scan results","Scans don't trace email delivery."],
["Endpoint antivirus logs","AV logs show detections, not routing."]],0,
"Email headers include Received lines, SPF/DKIM/DMARC results, and originating IPs, which reveal the delivery path.");
M("4.9","An IPS log shows repeated signature matches for 'SQL injection attempt' against a web server, but the web server's application logs show the requests returned errors. What can the analyst MOST likely conclude?",[
["Injection attempts were made but likely did not succeed"],
["The database was definitely exfiltrated","Error responses indicate the attempts likely failed; more evidence would be needed to conclude exfiltration."],
["The IPS logs are false negatives","The IPS detected activity, so it is not a false negative."],
["The attack was a DDoS","Signature matches for SQLi indicate injection attempts."]],0,
"Correlating multiple data sources (IPS, application, database logs) helps determine whether attacks succeeded.");
M("1.3","A technician wants to apply an emergency patch to a production server immediately without CAB review because 'it's a small change.' What is the BEST response according to change management principles?",[
["Follow the documented emergency change process, which still records and reviews the change"],
["Apply it without documentation since it's small","Undocumented changes cause outages and audit findings."],
["Wait until the next quarterly CAB meeting","Emergency processes exist for urgent changes."],
["Have a coworker apply it so it isn't attributed to the technician","This undermines accountability."]],0,
"Even urgent changes follow an expedited emergency change process with documentation and post-implementation review.");
M("1.3","Before an application upgrade, the team must update the firewall allow list so the new version can contact a licensing server. Which change management technical implication does this represent?",[
["Allow list / deny list updates"],
["Legacy application","Nothing indicates the application is legacy."],
["Restricted activity","No activity is being restricted."],
["Service restart only","Restarts are separate from firewall rule changes."]],0,
"Changes may require updates to allow/deny lists so the changed system functions without opening unnecessary access.");
M("5.4","A company that processes EU residents' personal data suffers a breach. Which TWO consequences of non-compliance with GDPR could it face? (Choose two.)",[
["Regulatory fines"],
["Reputational damage"],
["Automatic certification to ISO 27001","Breaches don't result in certifications."],
["Immunity from civil claims","Non-compliance increases legal exposure."],
["Exemption from breach notification","Notification obligations still apply."]],[0,1],
"GDPR non-compliance can lead to substantial fines, plus reputational damage, contractual impacts, and sanctions.");
M("5.6","A user finds a USB drive labeled 'Bonus Schedule' in the break room. According to security awareness training, what should she do?",[
["Turn it in to the security team without plugging it in"],
["Plug it into her computer to find the owner","Unknown removable media can contain malware."],
["Plug it into a home computer instead","This still risks infection and data exposure."],
["Throw it in the trash","It should be reported so security can investigate a possible baiting attack."]],0,
"Training on removable media teaches users not to use unknown devices and to report them.");
